name: Build Vex Downstairs Node v0.11.7.63 Upgrade

on:
  push:
    branches: [ "build/v11763-downstairs-node-upgrade" ]
    paths:
      - "Tools/Install-VexDownstairsNode-v0.11.7.63.ps1"
      - ".github/workflows/build-v11763-downstairs-node-upgrade.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-downstairs-node:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Reconstruct proven v0.11.7.39 Bridge source
        shell: pwsh
        run: |
          python Tools/build_v11728_chain.py
          python Tools/apply_v11729_windows_defender_safe.py
          python Tools/apply_v11729_bridge_onedir_hotfix.py
          python Tools/apply_v11734_bridge_responsive_boot.py
          python Tools/apply_v11737_ollama_recovery.py
          python Tools/apply_v11738_cognition_capacity_hotfix.py
          python Tools/apply_v11739_cognition_helper_bundle.py

      - name: Verify current mesh sources
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          bridge = Path("Bridge/vex_bridge.py").read_text(encoding="utf-8")
          node = Path("Tools/VexNodeAgent.py").read_text(encoding="utf-8")
          assert '"version": "0.11.7.39"' in bridge
          assert 'VERSION = "0.11.7.33"' in node
          assert '/brain/context' in bridge
          assert '/llm/chat' in bridge
          assert '/status' in node
          assert 'def _model_billions(name: str)' in bridge
          assert 'def _cognition_model_rank(name: str' in bridge
          print('Current Bridge + NodeAgent mesh sources verified')
          '@ | python -
          python -m py_compile Bridge/vex_bridge.py Tools/VexNodeAgent.py

      - name: Build current Vex Bridge
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --contents-directory VexBridgeRuntime --noupx --windowed `
            --name VexBridge `
            --distpath dist/downstairs `
            --workpath build/downstairs-bridge `
            --collect-all requests `
            --collect-all bs4 `
            --collect-all pypdf `
            --collect-all cryptography `
            Bridge/vex_bridge.py
          if (!(Test-Path dist/downstairs/VexBridge/VexBridge.exe)) { throw 'VexBridge.exe missing' }

      - name: Build current Vex Node Agent
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noupx --windowed `
            --name VexNodeAgent `
            --distpath dist/downstairs `
            --workpath build/downstairs-node `
            Tools/VexNodeAgent.py
          if (!(Test-Path dist/downstairs/VexNodeAgent/VexNodeAgent.exe)) { throw 'VexNodeAgent.exe missing' }

      - name: Prove packaged processes start
        shell: pwsh
        run: |
          Get-Process VexBridge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $bridge = Resolve-Path 'dist/downstairs/VexBridge/VexBridge.exe'
          $bp = Start-Process $bridge -WorkingDirectory (Split-Path $bridge) -PassThru
          Start-Sleep -Seconds 8
          $bp.Refresh()
          if ($bp.HasExited) { throw "Bridge exited during startup with code $($bp.ExitCode)" }
          python Tools/test_v11734_responsive_bridge.py
          python Tools/test_v11739_cognition_route.py
          Stop-Process -Id $bp.Id -Force -ErrorAction SilentlyContinue
          Get-Process VexBridge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $node = Resolve-Path 'dist/downstairs/VexNodeAgent/VexNodeAgent.exe'
          $np = Start-Process $node -WorkingDirectory (Split-Path $node) -PassThru
          Start-Sleep -Seconds 5
          $np.Refresh()
          if ($np.HasExited) { throw "NodeAgent exited during startup with code $($np.ExitCode)" }
          Stop-Process -Id $np.Id -Force -ErrorAction SilentlyContinue
          Write-Host 'Both packaged node processes remained alive during startup proof'

      - name: Package upgrade bundle
        shell: pwsh
        run: |
          $pkg = 'VexDownstairsNode-v0.11.7.63-Upgrade'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Recurse dist/downstairs/VexBridge "$pkg/VexBridge"
          Copy-Item -Recurse dist/downstairs/VexNodeAgent "$pkg/VexNodeAgent"
          Copy-Item Tools/Install-VexDownstairsNode-v0.11.7.63.ps1 "$pkg/Install-VexDownstairsNode-v0.11.7.63.ps1"
          @'
          VexNative Downstairs Node v0.11.7.63 Upgrade
          =============================================

          Purpose:
          - Upgrade the older downstairs node to the current Vex mesh components.
          - Current Vex Bridge component: 0.11.7.39
          - Current Vex Node Agent component: 0.11.7.33
          - Preserve existing AppData configuration and node identity.
          - Install side-by-side under LocalAppData\VexNative\DownstairsNode.
          - Add Bridge and NodeAgent to Windows Startup.

          INSTALL:
          1. Extract this entire ZIP to a normal folder.
          2. Right-click Install-VexDownstairsNode-v0.11.7.63.ps1 and run with PowerShell.
          3. Keep the VexBridge and VexNodeAgent folders intact.
          4. The installer starts both processes automatically.

          Do not delete the old node installation until the new node is field-verified.
          '@ | Set-Content -Encoding UTF8 "$pkg/README.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip" -Force

      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: VexDownstairsNode-v0.11.7.63-Upgrade
          path: VexDownstairsNode-v0.11.7.63-Upgrade.zip
          if-no-files-found: error
          retention-days: 14
