name: Build Vex Agent Runtime v0.11.7.54 Windows Native Autolearn Remote

on:
  push:
    branches: [ "feat/vex-agent-runtime-windows-v1" ]
    paths:
      - "Tools/apply_v11754_windows_native_autolearn_remote.py"
      - "Tools/ci_v11754_windows_native_autolearn_remote.py"
      - "Tools/test_v11754_windows_native_autolearn_remote.py"
      - "Tools/test_v11754_memory_regression.py"
      - ".github/workflows/build-v11754-windows-native-autolearn-remote.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v11754-windows-native-autolearn-remote:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Build and prove production Agent Runtime
        run: python Tools/ci_v11754_windows_native_autolearn_remote.py

      - name: Prove Windows-native and public-relay privacy boundaries
        run: python Tools/test_v11754_windows_native_autolearn_remote.py

      - name: Prove field memory write correction and recall survived
        run: python Tools/test_v11754_memory_regression.py

      - name: Upload proven v0.11.7.54 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.54-WindowsNative-AutolearnRemote
          path: Vex-Agent-Runtime-v0.11.7.54-WindowsNative-AutolearnRemote.zip
          if-no-files-found: error
          retention-days: 14
