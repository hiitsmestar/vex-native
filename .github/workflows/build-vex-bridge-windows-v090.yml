name: Build Vex Bridge v0.9.0 Windows

on:
  workflow_dispatch:
  push:
    branches: [ "ci/v090-natural-voice-media" ]
  pull_request:
    branches: [ "ci/v089-conversational-voice" ]

permissions:
  contents: read

jobs:
  build-windows-bridge:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts
      - name: Apply secure pairing
        run: python Tools/apply_v074_bridge_pairing_patch.py
      - name: Apply search routing
        run: python Tools/apply_v075_search_routing_patch.py
      - name: Apply direct-answer prerequisites
        run: python Tools/apply_v076_direct_research_answers_patch.py
      - name: Apply grounded web research
        run: python Tools/apply_v077_grounded_research_patch.py
      - name: Apply photo prerequisites
        run: python Tools/apply_v078_photo_context_patch.py
      - name: Apply visual replies
        run: |
          python Tools/apply_v079_camera_visual_replies_patch.py
          python Tools/apply_v079_compile_hotfix.py
      - name: Apply visual routing and viewer prerequisites
        run: |
          python Tools/apply_v0710_visual_intent_fix.py
          python Tools/apply_v0711_zoomable_chat_images.py
      - name: Prepare v0.8.2 patch chain
        run: python Tools/prepare_v082_build_chain.py
      - name: Apply hybrid PC expansion brain
        run: python Tools/apply_v080_hybrid_brain_patch.py
      - name: Apply dual-PC mesh
        run: python Tools/apply_v081_dual_pc_mesh_patch.py
      - name: Apply grounded PC tools
        run: python Tools/apply_v082_pc_tools_capability_patch.py
      - name: Apply browser and URL tools
        run: python Tools/apply_v083_browser_url_tools_patch.py
      - name: Apply self-learning safe skills
        run: |
          python Tools/apply_v084_self_learning_skills_patch.py
          python Tools/apply_v084_skill_resolution_order_hotfix.py
      - name: Apply safe workflow compiler
        run: python Tools/apply_v085_skill_compiler_patch.py
      - name: Apply media Bridge controls
        run: python Tools/apply_v086_bridge_media_patch.py
      - name: Apply neural voice and verified media resolver
        run: |
          python Tools/apply_v090_bridge_tts_media_patch.py
          Select-String -Path Bridge/vex_bridge.py -Pattern 'parsed.path == "/tts"'
          Select-String -Path Bridge/vex_bridge.py -Pattern 'parsed.path == "/media/play"'
          Select-String -Path Bridge/vex_bridge.py -Pattern '_local_browser_media_candidates'
          Select-String -Path Bridge/vex_bridge.py -Pattern '_verify_media_window'
          Select-String -Path Bridge/vex_bridge_full.py -Pattern 'VERSION = "0.9.0"'
      - name: Syntax check bridge
        run: python -m py_compile Bridge/vex_bridge.py Bridge/vex_bridge_full.py
      - name: Verify edge-tts import
        run: python -c "import edge_tts; print('edge-tts import OK')"
      - name: Build standalone VexBridge.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexBridge `
            --paths Bridge `
            --collect-all cryptography `
            --collect-all edge_tts `
            --hidden-import tkinter `
            --hidden-import vex_bridge `
            Bridge/vex_bridge_full.py
          if (!(Test-Path dist/VexBridge.exe)) { throw "VexBridge.exe was not created" }
      - name: Smoke-test packaged Bridge
        shell: pwsh
        run: |
          if ((Get-Item dist/VexBridge.exe).Length -lt 1000000) { throw "VexBridge.exe is unexpectedly small" }
          Get-FileHash dist/VexBridge.exe -Algorithm SHA256
      - name: Create quick-start text
        shell: pwsh
        run: |
          @"
          Vex Bridge v0.9.0 natural voice + grounded media
          =================================================

          Replace the existing VexBridge.exe on BOTH Windows PCs with this build.
          Existing per-PC pairing tokens, certificate pins, brain vaults, learned skills,
          and endpoint settings are reused. Do not delete the VexBridge app-data folder.

          v0.9.0 adds:
          - natural neural reply audio through edge-tts / Microsoft Edge TTS
          - authenticated /tts audio over the existing certificate-pinned Bridge channel
          - dedicated named-media routing that never falls into random PC file search
          - YouTube playlist/song matching from local Chrome/Edge bookmarks + history first
          - public YouTube search matching second, and honest search-results fallback
          - visible browser-window title verification before Vex says a matched page was verified
          - existing Windows media keys and safe skill compiler remain available

          The neural TTS service is online and sends only the reply text being spoken to the
          Microsoft speech service. It requires no API key or paid account. If it is unavailable,
          the iPhone falls back to its best installed iOS voice.

          There is still NO arbitrary shell/PowerShell execution and NO downloaded-code execution.
          "@ | Set-Content -Encoding UTF8 dist/README-VexBridge.txt
      - name: Package bridge zip
        shell: pwsh
        run: Compress-Archive -Path dist/VexBridge.exe,dist/README-VexBridge.txt -DestinationPath VexBridge-v0.9.0-Windows.zip -Force
      - name: Verify zip
        shell: pwsh
        run: |
          if (!(Test-Path VexBridge-v0.9.0-Windows.zip)) { throw "Bridge zip missing" }
          Get-FileHash VexBridge-v0.9.0-Windows.zip -Algorithm SHA256
      - name: Upload Windows bridge
        uses: actions/upload-artifact@v4
        with:
          name: VexBridge-v0.9.0-Windows
          path: VexBridge-v0.9.0-Windows.zip
          if-no-files-found: error
          retention-days: 7
