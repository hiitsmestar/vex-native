name: Build Vex Agent Runtime v0.11.7.80 Memory Route Punctuation Fix

on:
  push:
    branches: [ "fix/v11780-memory-contract-selftest" ]
    paths:
      - "Tools/apply_v11780_memory_route_punctuation_fix.py"
      - "Tools/ci_v11780_memory_route_punctuation_fix.py"
      - ".github/workflows/build-v11780-memory-route-punctuation-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Build production Agent Runtime
        run: python Tools/ci_v11780_memory_route_punctuation_fix.py
      - name: Verify exact field recall route
        shell: python
        run: |
          import ast
          from pathlib import Path

          bridge = Path("Bridge/vex_bridge.py").read_text(encoding="utf-8")
          installer = Path("Tools/VexAgentRuntimeInstall.py").read_text(encoding="utf-8")
          worker = Path("Tools/VexMemoryWorker.py").read_text(encoding="utf-8")
          assert '"agent_runtime_bundle": "0.11.7.80"' in bridge
          assert 'BUNDLE_VERSION = "0.11.7.80"' in installer
          assert 'VERSION = "0.11.4"' in worker
          assert 'pc-memory-star-query-v11775' in bridge
          assert "subject='star' OR canonical_key='core:star:profile'" in worker

          tree = ast.parse(bridge)
          fn = next(n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name == "_personal_memory_fact_question")
          module = ast.Module(body=[fn], type_ignores=[])
          ast.fix_missing_locations(module)
          ns = {"re": __import__("re")}
          exec(compile(module, "memory-route-test", "exec"), ns)
          route = ns["_personal_memory_fact_question"]
          assert route("What do you remember about me?") is True
          assert route("What do you remember about me") is True
          assert route("Baby, what do you remember about me?!") is True
          assert route("What is the weather today?") is False
          print("v0.11.7.80 exact field recall route verified")
      - name: Upload v0.11.7.80 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.80-MemoryRoutePunctuationFix
          path: Vex-Agent-Runtime-v0.11.7.80-MemoryRoutePunctuationFix.zip
          if-no-files-found: error
          retention-days: 14
