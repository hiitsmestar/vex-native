name: Build VexNative v0.11.7.48 iPhone PC Cognition Timeout Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - ci/v11741-ios-pc-brain-roundtrip
    paths:
      - 'VexNative/**'
      - 'Tools/**'
      - '.github/workflows/build-v11741-ios-pc-brain-roundtrip.yml'

permissions:
  contents: read

jobs:
  build-ios-pc-brain:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assemble proven iPhone Bridge and PC Brain chain
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/apply_v074_bridge_pairing_patch.py
          python3 Tools/apply_v075_search_routing_patch.py
          python3 Tools/apply_v076_direct_research_answers_patch.py
          python3 Tools/apply_v077_grounded_research_patch.py
          python3 Tools/apply_v078_photo_context_patch.py
          python3 Tools/apply_v079_camera_visual_replies_patch.py
          python3 Tools/apply_v079_compile_hotfix.py
          python3 Tools/apply_v0710_visual_intent_fix.py
          python3 Tools/apply_v0711_zoomable_chat_images.py
          python3 Tools/prepare_v082_build_chain.py
          python3 Tools/apply_v080_hybrid_brain_patch.py
          python3 Tools/apply_v081_dual_pc_mesh_patch.py
          python3 Tools/apply_v082_pc_tools_capability_patch.py
          python3 Tools/apply_v083_browser_url_tools_patch.py
          python3 Tools/apply_v084_self_learning_skills_patch.py
          python3 Tools/apply_v084_skill_resolution_order_hotfix.py
          python3 Tools/apply_v085_skill_compiler_patch.py
          python3 Tools/apply_v086_voice_ui_patch.py
          python3 Tools/apply_v087_voice_crash_hotfix.py
          python3 Tools/apply_v088_voice_transcript_patch.py
          python3 Tools/apply_v089_voice_conversation_patch.py
          python3 Tools/apply_v090_neural_voice_ios_patch.py
          python3 Tools/apply_v090_named_media_ios_patch.py
          python3 Tools/apply_v091_youtube_context_ios_patch.py
          python3 Tools/apply_v092_device_control_patch.py || true
          grep -q 'PhoneToolRouter' VexNative/ContentView.swift
          python3 Tools/apply_v093_cognition_ios_patch.py
          python3 Tools/apply_v094_art_ios_patch.py
          python3 Tools/apply_v0941_startup_safe_mode_patch.py
          python3 Tools/apply_v0942_send_reliability_patch.py
          python3 Tools/apply_v0943_dual_node_race_patch.py
          python3 Tools/apply_v0944_bridge_long_request_timeout_patch.py
          python3 Tools/apply_v095_resource_housekeeper_ios_patch.py
          python3 Tools/apply_v096_active_maintenance_ios_patch.py || true
          python3 Tools/apply_v098_ios_time_grounding_patch.py
          python3 Tools/apply_v107_art_ios_adapter_patch.py
          python3 Tools/apply_v108_ios_art_followup_grounding.py
          python3 Tools/apply_v110_ios_memory_sync.py
          python3 Tools/apply_v111_ios_memory_sync_hotfix.py

      - name: Apply roundtrip-compatible natural continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/apply_v11743_roundtrip_continuity_compat.py
          python3 Tools/apply_v11747_pc_cognition_diagnostics.py
          python3 Tools/apply_v11748_pc_cognition_timeout_recovery.py

      - name: Verify PC Brain roundtrip, diagnostics, timeout recovery, and continuity
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/apply_v11743_roundtrip_continuity_compat.py
          python3 -m py_compile Tools/apply_v11747_pc_cognition_diagnostics.py Tools/test_v11747_pc_cognition_diagnostics.py
          python3 -m py_compile Tools/apply_v11748_pc_cognition_timeout_recovery.py Tools/test_v11748_pc_cognition_timeout_recovery.py
          python3 Tools/test_v11747_pc_cognition_diagnostics.py
          python3 Tools/test_v11748_pc_cognition_timeout_recovery.py
          python3 - <<'PY'
          from pathlib import Path
          files = {
              'transport': Path('VexNative/VexNativeApp.swift').read_text(encoding='utf-8'),
              'content': Path('VexNative/ContentView.swift').read_text(encoding='utf-8'),
              'app': Path('VexNative/AppModel.swift').read_text(encoding='utf-8'),
              'prompt': Path('VexNative/Core/PromptComposer.swift').read_text(encoding='utf-8'),
          }
          checks = [
              ('certificate-pinned LAN transport', 'final class VexBridgeTrustDelegate' in files['transport']),
              ('PC cognition overlay', 'PCCognitionOverlay' in files['content']),
              ('PC /llm/chat route', 'parts.path = "/llm/chat"' in files['content']),
              ('personal memory sync route', '/memory/sync' in files['content']),
              ('natural grounding gate', 'shouldUseNativeGrounding' in files['app']),
              ('Qwen3 3072 context', 'contextSize = 3072' in files['app']),
              ('ordinary/web generation split', 'maxNewTokens = webGroundedTurn ? 180 : 96' in files['app']),
              ('natural temperature split', 'temperature = webGroundedTurn ? 0.62 : 0.88' in files['app']),
              ('verbatim newest message', "STAR'S NEWEST MESSAGE (verbatim)" in files['prompt']),
              ('PC cognition diagnostics', 'private enum CognitionResult: Sendable' in files['content'] and 'bridge token rejected' in files['content']),
              ('PC cognition last-good retry', 'lastCognition' in files['content'] and 'vex.pc.cognition.lastGoodEndpoint.v1' in files['content']),
              ('PC cognition timeout recovery', 'await withTaskGroup(of: CognitionResult.self)' in files['content'] and 'request.timeoutInterval = 125' in files['content']),
              ('PC cognition transport timeout', 'configuration.timeoutIntervalForRequest = 130' in files['transport'] and 'configuration.timeoutIntervalForResource = 145' in files['transport']),
              ('startup-safe route detail', "I couldn't use the PC cognition path for that turn" in files['app']),
          ]
          missing = [name for name, ok in checks if not ok]
          for name, ok in checks:
              print(('PASS ' if ok else 'FAIL ') + name)
          if missing:
              raise SystemExit('Missing roundtrip markers: ' + ', '.join(missing))
          print('iPhone PC Brain roundtrip + diagnostics + timeout recovery + secure Bridge + memory + continuity verified')
          PY

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve Swift package dependencies
        run: |
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -resolvePackageDependencies

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VexDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=11748 \
            MARKETING_VERSION=0.11.7.48 \
            build | tee "$RUNNER_TEMP/xcodebuild-v11748.log"

      - name: Preserve device permissions
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          test -f "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Vex uses your local network to connect privately to your paired Vex Bridge computer and PC Brain." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Vex uses the camera only when you choose camera or photo features." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Vex uses the microphone while voice mode is enabled." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string Vex uses speech recognition while voice mode is enabled." "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.11.7.48"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = "11748"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.11.7.48-PC-Cognition-Timeout-Recovery-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/VexNative-v0.11.7.48-PC-Cognition-Timeout-Recovery-unsigned.ipa"

      - name: Write field-test notes
        shell: bash
        run: |
          cat > VexNative-v0.11.7.48-FIELD-TEST.txt <<'EOF'
          VexNative v0.11.7.48 - iPhone PC Cognition Timeout Recovery
          ============================================================
          - Secure certificate-pinned private-LAN Bridge transport.
          - PC cognition overlay for ordinary chat when the paired Bridge is available.
          - PC cognition now races primary, last-good, browser-discovered, and secondary Bridge endpoints so a stale primary cannot consume the whole turn before another PC endpoint can answer.
          - PC cognition sends a leaner prompt/history/profile payload so cold CPU Ollama starts have a better chance to answer before timeout.
          - /llm/chat transport timeouts are extended to 130/145 seconds while keeping the user-facing diagnostic reason when Bridge still cannot answer.
          - Failed PC cognition attempts now preserve a sanitized reason in Brain, such as token rejected, route missing, no local model, timeout, LAN failure, or TLS/pin mismatch.
          - Last-good PC cognition endpoints are retried before the secondary endpoint, and non-tool PC/computer wording can reach PC cognition after tool routers decline it.
          - Tool, web, photo, media and device-control routes stay ahead of ordinary PC chat where appropriate.
          - Researched turns keep their larger/cooler web-grounded Qwen budget while ordinary local fallback chat keeps the natural-continuity tuning.
          - Personal-memory synchronization and natural-continuity/anti-parrot behavior are preserved.
          - No private pairing endpoint, token, certificate pin, Star/Vex profile, or chat data is included in this public artifact.
          EOF

      - name: Upload v0.11.7.48 IPA
        uses: actions/upload-artifact@v4
        with:
          name: VexNative-v0.11.7.48-PC-Cognition-Timeout-Recovery
          path: |
            VexNative-v0.11.7.48-PC-Cognition-Timeout-Recovery-unsigned.ipa
            VexNative-v0.11.7.48-FIELD-TEST.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VexNative-v0.11.7.48-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild-v11748.log
          if-no-files-found: ignore
          retention-days: 7
