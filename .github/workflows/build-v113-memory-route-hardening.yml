name: Build VexNative v0.11.6.1 Low-Memory Initiative

on:
  push:
    branches: [ "ci/v113-memory-route-hardening" ]
  pull_request:
    branches: [ "ci/v112-memory-recall-latency" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Apply Bridge patch chain
        shell: pwsh
        run: |
          python Tools/apply_v074_bridge_pairing_patch.py
          python Tools/apply_v075_search_routing_patch.py
          python Tools/apply_v076_direct_research_answers_patch.py
          python Tools/apply_v077_grounded_research_patch.py
          python Tools/apply_v078_photo_context_patch.py
          python Tools/apply_v079_camera_visual_replies_patch.py
          python Tools/apply_v079_compile_hotfix.py
          python Tools/apply_v0710_visual_intent_fix.py
          python Tools/apply_v0711_zoomable_chat_images.py
          python Tools/prepare_v082_build_chain.py
          python Tools/apply_v080_hybrid_brain_patch.py
          python Tools/apply_v081_dual_pc_mesh_patch.py
          python Tools/apply_v082_pc_tools_capability_patch.py
          python Tools/apply_v083_browser_url_tools_patch.py
          python Tools/apply_v084_self_learning_skills_patch.py
          python Tools/apply_v084_skill_resolution_order_hotfix.py
          python Tools/apply_v085_skill_compiler_patch.py
          python Tools/apply_v086_bridge_media_patch.py
          python Tools/apply_v090_bridge_neural_media_patch.py
          python Tools/apply_v091_youtube_context_bridge_patch.py
          python Tools/apply_v092_bridge_control_patch.py
          python Tools/apply_v093_cognition_bridge_patch.py
          python Tools/apply_v094_art_bridge_patch.py
          python Tools/apply_v095_resource_housekeeper_art_patch.py
          python Tools/apply_v096_active_maintenance_bridge_patch.py
          python Tools/apply_v0961_bridge_stability_patch.py
          python Tools/apply_v0962_self_healing_patch.py
          python Tools/apply_v097_learning_engine_art_repair_patch.py
          python Tools/apply_v0971_art_dll_hotfix.py
          python Tools/apply_v0972_slow_cpu_coordination_hotfix.py
          python Tools/apply_v0973_render_grounding_learning_hotfix.py
          python Tools/apply_v098_modular_toolbox_time_patch.py
          python Tools/apply_v100_art_worker_hotfix.py
          python Tools/apply_v102_art_safe_lowmem_patch.py
          python Tools/apply_v103_lite_art_patch.py
          python Tools/apply_v104_art_clipboard_patch.py
          python Tools/apply_v105_art_realism_patch.py
          python Tools/apply_v106_smart_prompt_patch.py
          python Tools/apply_v106_smart_prompt_generic_fix.py
          python Tools/prepare_v107_adapter_build.py
          python Tools/apply_v107_art_worker_adapter_patch.py
          python Tools/apply_v1071_adapter_coordination_fix.py
          python Tools/apply_v108_windows_cognition_render_stability.py
          python Tools/apply_v109_adaptive_pc_cognition.py
          python Tools/apply_v1091_remote_support_compile_fix.py
          python Tools/apply_v1092_cognition_recursion_hotfix.py
          python Tools/apply_v1093_runtime_identity_grounding.py
          python Tools/apply_v1094_verified_runtime_fact_route.py
          python Tools/apply_v110_personal_memory_worker.py
          python Tools/apply_v110_package_versions.py
          python Tools/apply_v112_verified_personal_recall.py
          python Tools/apply_v111_remote_support_pagination.py
          python Tools/apply_v112_package_versions.py
          python Tools/apply_v113_memory_route_hardening.py
          python Tools/apply_v114_adaptive_learning_supervisor.py
          python Tools/apply_v115_autonomous_self_improvement.py
          python Tools/apply_v116_initiative_self_model.py
          python Tools/apply_v1161_low_memory_initiative_fix.py

      - name: Verify low-memory initiative architecture
        shell: pwsh
        run: |
          python -m py_compile Bridge/vex_bridge.py Bridge/vex_bridge_full.py Tools/apply_v114_adaptive_learning_supervisor.py Tools/apply_v115_autonomous_self_improvement.py Tools/apply_v116_initiative_self_model.py Tools/apply_v1161_low_memory_initiative_fix.py
          $src = Get-Content Bridge/vex_bridge.py -Raw
          if (-not $src.Contains('"version": "0.11.6.1"')) { throw "v0.11.6.1 Bridge version marker missing" }
          if (-not $src.Contains('INITIATIVE_GOALS')) { throw "persistent initiative goals missing" }
          if (-not $src.Contains('INITIATIVE_ACTIONS')) { throw "initiative action allowlist missing" }
          if (-not $src.Contains('CREATE TABLE IF NOT EXISTS initiative_goals')) { throw "initiative goal store missing" }
          if (-not $src.Contains('CREATE TABLE IF NOT EXISTS initiative_events')) { throw "initiative event continuity missing" }
          if (-not $src.Contains('CREATE TABLE IF NOT EXISTS self_state')) { throw "operational self-state store missing" }
          if (-not $src.Contains('def _initiative_self_snapshot(')) { throw "self inspection missing" }
          if (-not $src.Contains('def _initiative_choose_action(')) { throw "local initiative planner missing" }
          if (-not $src.Contains('def _initiative_execute(')) { throw "initiative executor missing" }
          if (-not $src.Contains('def _initiative_context(')) { throw "initiative continuity context missing" }
          if (-not $src.Contains('def _initiative_worker_once(')) { throw "initiative worker missing" }
          if (-not $src.Contains('_initiative_worker_once(force=False)')) { throw "initiative not connected to idle loop" }
          if (-not $src.Contains('initiative_context = _initiative_context(message)')) { throw "self-model not connected to ordinary cognition" }
          if (-not $src.Contains('IDLE_AUTONOMY_HARD_FLOOR_BYTES')) { throw "low-memory hard floor missing" }
          if (-not $src.Contains('IDLE_AUTONOMY_PLANNER_FLOOR_BYTES')) { throw "low-memory planner floor missing" }
          if (-not $src.Contains('low-memory deterministic initiative')) { throw "low-memory deterministic initiative fallback missing" }
          if (-not $src.Contains('snapshot["scheduler_mode"]')) { throw "initiative scheduler-mode telemetry missing" }
          if (-not $src.Contains('model-backed upgrade synthesis deferred')) { throw "low-memory upgrade gating missing" }
          if (-not $src.Contains('parsed.path == "/initiative/status"')) { throw "initiative status route missing" }
          if (-not $src.Contains('parsed.path == "/initiative/run"')) { throw "initiative run route missing" }
          Write-Host "verified v0.11.6.1 autonomous progress under low-memory conditions"

      - name: Build Bridge
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexBridge `
            --paths Bridge `
            --collect-all cryptography `
            --collect-all edge_tts `
            --collect-all yt_dlp `
            --hidden-import tkinter `
            --hidden-import sqlite3 `
            --hidden-import vex_bridge `
            --hidden-import winrt.windows.media.control `
            Bridge/vex_bridge_full.py
          if (!(Test-Path dist/VexBridge.exe)) { throw "VexBridge.exe missing" }

      - name: Package v0.11.6.1
        shell: pwsh
        run: |
          @'
          VexNative v0.11.6.1 - Low-Memory Autonomous Initiative
          ======================================================
          - Keeps the v0.11.6 persistent goals, operational self-model, autonomous action history, and conversational initiative context.
          - Fixes a field scheduling problem where conservative 1.4-1.6 GB free-RAM gates could postpone all background adaptation/autonomy/initiative indefinitely on the tested 8 GB PC.
          - Moderate memory pressure now uses a lightweight autonomous path instead of doing nothing: capability probes, skill validation, sanitized technical-gap research, and self-state updates can continue while idle.
          - Model-backed initiative planning runs when there is enough headroom; otherwise a deterministic low-risk internal action advances the same persistent goals without another LLM inference.
          - Upgrade-candidate synthesis waits for better headroom instead of competing with foreground cognition.
          - Art Worker and foreground conversation still have priority; severe memory pressure still pauses background work.
          - Existing v0.11.2 Memory Worker/database stay intact; iPhone stays on v0.11.1.
          '@ | Set-Content -Encoding UTF8 dist/README-v0.11.6.1.txt
          Compress-Archive -Path dist/VexBridge.exe,dist/README-v0.11.6.1.txt -DestinationPath VexNative-v0.11.6.1-Bridge-Low-Memory-Initiative.zip -Force
          Expand-Archive VexNative-v0.11.6.1-Bridge-Low-Memory-Initiative.zip -DestinationPath verify-package -Force
          if (!(Test-Path verify-package/VexBridge.exe)) { throw "packaged VexBridge.exe missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: VexNative-v0.11.6.1-Bridge-Low-Memory-Initiative
          path: VexNative-v0.11.6.1-Bridge-Low-Memory-Initiative.zip
          retention-days: 7
