name: Build VexNative v0.11.5 Autonomous Self-Improvement

on:
  push:
    branches: [ "ci/v113-memory-route-hardening" ]
  pull_request:
    branches: [ "ci/v112-memory-recall-latency" ]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Apply Bridge patch chain
        shell: pwsh
        run: |
          python Tools/apply_v074_bridge_pairing_patch.py
          python Tools/apply_v075_search_routing_patch.py
          python Tools/apply_v076_direct_research_answers_patch.py
          python Tools/apply_v077_grounded_research_patch.py
          python Tools/apply_v078_photo_context_patch.py
          python Tools/apply_v079_camera_visual_replies_patch.py
          python Tools/apply_v079_compile_hotfix.py
          python Tools/apply_v0710_visual_intent_fix.py
          python Tools/apply_v0711_zoomable_chat_images.py
          python Tools/prepare_v082_build_chain.py
          python Tools/apply_v080_hybrid_brain_patch.py
          python Tools/apply_v081_dual_pc_mesh_patch.py
          python Tools/apply_v082_pc_tools_capability_patch.py
          python Tools/apply_v083_browser_url_tools_patch.py
          python Tools/apply_v084_self_learning_skills_patch.py
          python Tools/apply_v084_skill_resolution_order_hotfix.py
          python Tools/apply_v085_skill_compiler_patch.py
          python Tools/apply_v086_bridge_media_patch.py
          python Tools/apply_v090_bridge_neural_media_patch.py
          python Tools/apply_v091_youtube_context_bridge_patch.py
          python Tools/apply_v092_bridge_control_patch.py
          python Tools/apply_v093_cognition_bridge_patch.py
          python Tools/apply_v094_art_bridge_patch.py
          python Tools/apply_v095_resource_housekeeper_art_patch.py
          python Tools/apply_v096_active_maintenance_bridge_patch.py
          python Tools/apply_v0961_bridge_stability_patch.py
          python Tools/apply_v0962_self_healing_patch.py
          python Tools/apply_v097_learning_engine_art_repair_patch.py
          python Tools/apply_v0971_art_dll_hotfix.py
          python Tools/apply_v0972_slow_cpu_coordination_hotfix.py
          python Tools/apply_v0973_render_grounding_learning_hotfix.py
          python Tools/apply_v098_modular_toolbox_time_patch.py
          python Tools/apply_v100_art_worker_hotfix.py
          python Tools/apply_v102_art_safe_lowmem_patch.py
          python Tools/apply_v103_lite_art_patch.py
          python Tools/apply_v104_art_clipboard_patch.py
          python Tools/apply_v105_art_realism_patch.py
          python Tools/apply_v106_smart_prompt_patch.py
          python Tools/apply_v106_smart_prompt_generic_fix.py
          python Tools/prepare_v107_adapter_build.py
          python Tools/apply_v107_art_worker_adapter_patch.py
          python Tools/apply_v1071_adapter_coordination_fix.py
          python Tools/apply_v108_windows_cognition_render_stability.py
          python Tools/apply_v109_adaptive_pc_cognition.py
          python Tools/apply_v1091_remote_support_compile_fix.py
          python Tools/apply_v1092_cognition_recursion_hotfix.py
          python Tools/apply_v1093_runtime_identity_grounding.py
          python Tools/apply_v1094_verified_runtime_fact_route.py
          python Tools/apply_v110_personal_memory_worker.py
          python Tools/apply_v110_package_versions.py
          python Tools/apply_v112_verified_personal_recall.py
          python Tools/apply_v111_remote_support_pagination.py
          python Tools/apply_v112_package_versions.py
          python Tools/apply_v113_memory_route_hardening.py
          python Tools/apply_v114_adaptive_learning_supervisor.py
          python Tools/apply_v115_autonomous_self_improvement.py

      - name: Verify autonomous self-improvement architecture
        shell: pwsh
        run: |
          python -m py_compile Bridge/vex_bridge.py Bridge/vex_bridge_full.py Tools/apply_v114_adaptive_learning_supervisor.py Tools/apply_v115_autonomous_self_improvement.py
          $src = Get-Content Bridge/vex_bridge.py -Raw
          if (-not $src.Contains('"version": "0.11.5.0"')) { throw "v0.11.5 Bridge version marker missing" }
          if (-not $src.Contains('ADAPTIVE_DB')) { throw "adaptive experience database missing" }
          if (-not $src.Contains('AUTONOMY_CAPABILITIES')) { throw "feature curriculum missing" }
          if (-not $src.Contains('def _autonomy_worker_once(')) { throw "autonomy worker missing" }
          if (-not $src.Contains('def _autonomy_public_research_topic(')) { throw "private/public research boundary missing" }
          if (-not $src.Contains('def _autonomy_private_memory_guidance(')) { throw "private memory adaptation missing" }
          if (-not $src.Contains('def _autonomy_stage_upgrade_candidate(')) { throw "upgrade candidate staging missing" }
          if (-not $src.Contains('CREATE TABLE IF NOT EXISTS capabilities')) { throw "capability familiarity store missing" }
          if (-not $src.Contains('CREATE TABLE IF NOT EXISTS upgrade_candidates')) { throw "upgrade candidate store missing" }
          if (-not $src.Contains('parsed.path == "/autonomy/status"')) { throw "autonomy status route missing" }
          if (-not $src.Contains('parsed.path == "/autonomy/run"')) { throw "autonomy run route missing" }
          if (-not $src.Contains('_autonomy_worker_once(force=False)')) { throw "idle feature curriculum not connected" }
          if (-not $src.Contains('private_memory_guidance = _autonomy_private_memory_guidance()')) { throw "private memory not connected to idle adaptation" }
          if (-not $src.Contains('public_topic = _autonomy_public_research_topic')) { throw "adaptive gaps can still leak raw private text to public research" }
          Write-Host "verified v0.11.5 autonomous idle learning, capability rehearsal, bounded repair, private-memory adaptation, and staged upgrades"

      - name: Build Bridge
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexBridge `
            --paths Bridge `
            --collect-all cryptography `
            --collect-all edge_tts `
            --collect-all yt_dlp `
            --hidden-import tkinter `
            --hidden-import sqlite3 `
            --hidden-import vex_bridge `
            --hidden-import winrt.windows.media.control `
            Bridge/vex_bridge_full.py
          if (!(Test-Path dist/VexBridge.exe)) { throw "VexBridge.exe missing" }

      - name: Package v0.11.5
        shell: pwsh
        run: |
          @'
          VexNative v0.11.5.0 - Autonomous Self-Improvement
          ==================================================
          - Ordinary conversation now uses semantic personal-memory grounding + adaptive cognition rather than an expanding list of natural-memory trigger phrases.
          - Real exchanges become persistent experience; idle local cognition extracts high-confidence routing/naturalness/capability/repair lessons.
          - While idle, Vex rotates through an internal feature curriculum and probes the capabilities she already has.
          - Learned skill recipes are dry-run validated/rehearsed without causing side effects.
          - Unhealthy known components can invoke the existing bounded self-repair supervisor with circuit breakers.
          - Capability gaps feed the existing source-grounded public Learning Engine using sanitized generic technical queries only.
          - Saved personal memory may guide the LOCAL idle reviewer, but private memory text is never sent to public web research.
          - Improvement gaps can become local staged upgrade candidates with acceptance tests/risk/confidence. Running binaries are not blindly rewritten.
          - Existing v0.11.2 Memory Worker/database stay intact; iPhone stays on v0.11.1.
          '@ | Set-Content -Encoding UTF8 dist/README-v0.11.5.0.txt
          Compress-Archive -Path dist/VexBridge.exe,dist/README-v0.11.5.0.txt -DestinationPath VexNative-v0.11.5.0-Bridge-Autonomous-Self-Improvement.zip -Force
          Expand-Archive VexNative-v0.11.5.0-Bridge-Autonomous-Self-Improvement.zip -DestinationPath verify-package -Force
          if (!(Test-Path verify-package/VexBridge.exe)) { throw "packaged VexBridge.exe missing" }

      - uses: actions/upload-artifact@v4
        with:
          name: VexNative-v0.11.5.0-Bridge-Autonomous-Self-Improvement
          path: VexNative-v0.11.5.0-Bridge-Autonomous-Self-Improvement.zip
          retention-days: 7
