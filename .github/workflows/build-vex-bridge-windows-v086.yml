name: Build Vex Bridge v0.8.6 Windows

on:
  workflow_dispatch:
  push:
    branches: [ "ci/v086-handsfree-media" ]
  pull_request:
    branches: [ "ci/v085-skill-compiler" ]

permissions:
  contents: read

jobs:
  build-windows-bridge:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography
      - name: Apply secure pairing
        run: python Tools/apply_v074_bridge_pairing_patch.py
      - name: Apply search routing
        run: python Tools/apply_v075_search_routing_patch.py
      - name: Apply direct-answer prerequisites
        run: python Tools/apply_v076_direct_research_answers_patch.py
      - name: Apply grounded web research
        run: python Tools/apply_v077_grounded_research_patch.py
      - name: Apply photo prerequisites
        run: python Tools/apply_v078_photo_context_patch.py
      - name: Apply visual replies
        run: |
          python Tools/apply_v079_camera_visual_replies_patch.py
          python Tools/apply_v079_compile_hotfix.py
      - name: Apply visual routing and viewer prerequisites
        run: |
          python Tools/apply_v0710_visual_intent_fix.py
          python Tools/apply_v0711_zoomable_chat_images.py
      - name: Prepare v0.8.2 patch chain
        run: python Tools/prepare_v082_build_chain.py
      - name: Apply hybrid PC expansion brain
        run: python Tools/apply_v080_hybrid_brain_patch.py
      - name: Apply dual-PC mesh
        run: python Tools/apply_v081_dual_pc_mesh_patch.py
      - name: Apply grounded PC tools
        run: python Tools/apply_v082_pc_tools_capability_patch.py
      - name: Apply browser and URL tools
        run: python Tools/apply_v083_browser_url_tools_patch.py
      - name: Apply self-learning safe skills
        run: |
          python Tools/apply_v084_self_learning_skills_patch.py
          python Tools/apply_v084_skill_resolution_order_hotfix.py
      - name: Apply safe workflow compiler
        run: python Tools/apply_v085_skill_compiler_patch.py
      - name: Apply media Bridge controls
        run: |
          python Tools/apply_v086_bridge_media_patch.py
          Select-String -Path Bridge/vex_bridge.py -Pattern 'media_play_pause'
          Select-String -Path Bridge/vex_bridge.py -Pattern '_resolve_named_media'
          Select-String -Path Bridge/vex_bridge_full.py -Pattern 'VERSION = "0.8.6"'
      - name: Syntax check bridge
        run: python -m py_compile Bridge/vex_bridge.py Bridge/vex_bridge_full.py
      - name: Build standalone VexBridge.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexBridge `
            --paths Bridge `
            --collect-all cryptography `
            --hidden-import tkinter `
            --hidden-import vex_bridge `
            Bridge/vex_bridge_full.py
          if (!(Test-Path dist/VexBridge.exe)) { throw "VexBridge.exe was not created" }
      - name: Create quick-start text
        shell: pwsh
        run: |
          @"
          Vex Bridge v0.8.6 hands-free/media quick start
          ================================================

          Run the same VexBridge.exe on both Windows PCs.
          Existing per-PC pairing tokens, certificate pins, brain vaults, and learned skills are reused.

          v0.8.6 keeps the self-learning safe skill compiler and adds:
          - Windows play/pause, next, previous, mute, volume up and volume down media keys
          - named YouTube/media discovery for commands such as play a named playlist
          - recent-PC target carryover so natural follow-ups can continue on the last named machine

          Media discovery opens verified http/https YouTube results only.
          There is still NO arbitrary shell/PowerShell execution and NO downloaded-code execution.
          "@ | Set-Content -Encoding UTF8 dist/README-VexBridge.txt
      - name: Package bridge zip
        shell: pwsh
        run: Compress-Archive -Path dist/VexBridge.exe,dist/README-VexBridge.txt -DestinationPath VexBridge-v0.8.6-Windows.zip -Force
      - name: Upload Windows bridge
        uses: actions/upload-artifact@v4
        with:
          name: VexBridge-v0.8.6-Windows
          path: VexBridge-v0.8.6-Windows.zip
          if-no-files-found: error
          retention-days: 7
