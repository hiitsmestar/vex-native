name: Build Vex Agent Runtime v0.11.7.52 Memory Correction

on:
  push:
    branches: [ "feat/vex-agent-runtime-windows-v1" ]
    paths:
      - "Tools/apply_v11750_windows_locale_hotfix.py"
      - "Tools/apply_v11751_explicit_memory_write.py"
      - "Tools/apply_v11752_memory_correction.py"
      - "Tools/ci_v11752_memory_correction.py"
      - "Tools/test_v11752_memory_correction.py"
      - ".github/workflows/build-v11752-memory-correction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v11752-memory-correction:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Build and prove Agent Runtime
        run: python Tools/ci_v11752_memory_correction.py
      - name: Prove newest correction supersedes old persistent fact
        run: python Tools/test_v11752_memory_correction.py
      - name: Upload proven v0.11.7.52 memory-correction runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.52-MemoryCorrection
          path: Vex-Agent-Runtime-v0.11.7.52-MemoryCorrection.zip
          if-no-files-found: error
          retention-days: 14
