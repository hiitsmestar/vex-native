name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [ "main", "ci/v060-web-brain", "ci/v070-vex-bridge", "ci/v072-bridge-pinned-tls", "ci/v073-bridge-direct-tls-session", "ci/v074-bridge-cert-pinning", "ci/v075-bridge-search-routing", "ci/v076-direct-research-answers", "ci/v077-grounded-research", "ci/v078-photo-context-grounded-procedures", "ci/v079-camera-visual-replies", "ci/v0710-visual-intent-fix" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply v0.7.4 secure bridge pairing patch
        run: |
          python3 Tools/apply_v074_bridge_pairing_patch.py
          grep -n "certificateMismatch" VexNative/VexNativeApp.swift
          grep -n "VexBridgeNetworking.data" VexNative/ContentView.swift
          grep -n "try the bridge" VexNative/ContentView.swift

      - name: Apply v0.7.5 intent routing patch
        run: |
          python3 Tools/apply_v075_search_routing_patch.py
          grep -n "BridgeSearchScope" VexNative/ContentView.swift
          grep -n 'URLQueryItem(name: "scope"' VexNative/ContentView.swift
          grep -n "stripConversationalSearchPrefix" VexNative/ContentView.swift
          grep -n 'scope not in {"web", "pc", "both"}' Bridge/vex_bridge.py

      - name: Apply v0.7.6 direct researched-answer patch
        run: |
          python3 Tools/apply_v076_direct_research_answers_patch.py
          grep -n "WEB RESEARCH ANSWER MODE" VexNative/Core/PromptComposer.swift
          grep -n "webGroundedTurn ? 180" VexNative/AppModel.swift
          grep -n "MarkdownParsingOptions" VexNative/Views/ChatBubble.swift
          grep -n "source.url.absoluteString" VexNative/ContentView.swift

      - name: Apply v0.7.7 grounded research patch
        run: |
          python3 Tools/apply_v077_grounded_research_patch.py
          grep -n "isProceduralResearchRequest" VexNative/ContentView.swift
          grep -n "resolvedResearchInput" VexNative/ContentView.swift
          grep -n "webGroundedTurn ? 240" VexNative/AppModel.swift
          grep -n "focused_web_excerpt" Bridge/vex_bridge.py

      - name: Apply v0.7.8 photo context and grounded procedure patch
        run: |
          python3 Tools/apply_v078_photo_context_patch.py
          grep -n "PhotosPicker" VexNative/ContentView.swift
          grep -n "PhotoContextAnalyzer" VexNative/ContentView.swift
          grep -n "groundedProceduralAnswer" VexNative/ContentView.swift
          grep -n "pendingPhotoData" VexNative/AppModel.swift
          grep -n "imageFilename" VexNative/Core/BrainModels.swift

      - name: Apply v0.7.9 camera and visual reply patch
        run: |
          python3 Tools/apply_v079_camera_visual_replies_patch.py
          python3 Tools/apply_v079_compile_hotfix.py
          grep -n "CameraCaptureView" VexNative/ContentView.swift
          grep -n "Take Photo" VexNative/ContentView.swift
          grep -n "fetchVisualImage" VexNative/ContentView.swift
          grep -n "VisualReplyRenderer" VexNative/ContentView.swift
          grep -n "web_image_search" Bridge/vex_bridge.py
          grep -n "cgContext.fill" VexNative/ContentView.swift

      - name: Apply v0.7.10 visual intent fix
        run: |
          python3 Tools/apply_v0710_visual_intent_fix.py
          grep -n "visualRequest || web.shouldUseWeb" VexNative/ContentView.swift
          grep -n "referentialFollowup" VexNative/ContentView.swift
          grep -n '"pic", "pics", "picture", "pictures"' VexNative/ContentView.swift

      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve local Swift package
        run: |
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -resolvePackageDependencies

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"

          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VexDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=80 \
            MARKETING_VERSION=0.7.10 \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Add device permissions to built app
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          test -f "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Vex uses your local network to connect privately to your paired Vex Bridge computer." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Vex uses the camera only when you choose Take Photo so you can attach a picture to your private chat." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSLocalNetworkUsageDescription" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$INFO_PLIST"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"

          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-unsigned.ipa" Payload

          echo "Unsigned IPA:"
          ls -lh "$GITHUB_WORKSPACE/VexNative-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VexNative-unsigned-IPA-v0.7.10
          path: VexNative-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VexNative-xcodebuild-log-v0.7.10
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
