name: Build Vex Bridge Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "ci/v070-vex-bridge", "ci/v074-bridge-cert-pinning", "ci/v075-bridge-search-routing" ]
    paths:
      - "Bridge/**"
      - "Tools/apply_v074_bridge_pairing_patch.py"
      - "Tools/apply_v075_search_routing_patch.py"
      - ".github/workflows/build-vex-bridge-windows.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Bridge/**"
      - "Tools/apply_v074_bridge_pairing_patch.py"
      - "Tools/apply_v075_search_routing_patch.py"
      - ".github/workflows/build-vex-bridge-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-bridge:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography

      - name: Apply v0.7.4 secure pairing patch
        run: |
          python Tools/apply_v074_bridge_pairing_patch.py

      - name: Apply v0.7.5 intent routing patch
        run: |
          python Tools/apply_v075_search_routing_patch.py
          findstr /C:"scope not in" Bridge\vex_bridge.py
          findstr /C:"VERSION = \"0.7.5\"" Bridge\vex_bridge_full.py

      - name: Syntax check bridge
        run: |
          python -m py_compile Bridge/vex_bridge.py Bridge/vex_bridge_full.py

      - name: Build standalone VexBridge.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexBridge `
            --paths Bridge `
            --collect-all cryptography `
            --hidden-import tkinter `
            --hidden-import vex_bridge `
            Bridge/vex_bridge_full.py
          if (!(Test-Path dist/VexBridge.exe)) { throw "VexBridge.exe was not created" }
          Get-Item dist/VexBridge.exe | Format-List Name,Length

      - name: Create quick-start text
        shell: pwsh
        run: |
          @"
          Vex Bridge v0.7.5 quick start
          ==============================

          1. Close any older VexBridge.exe window.
          2. Run this VexBridge.exe on the Windows PC.
          3. No folder selection is required. Vex automatically gets searchable access to user-readable fixed drives.
          4. Windows/Program Files/system caches are skipped by the content index so the PC does not spend hours indexing OS noise.
          5. The bridge comes online immediately and indexes files in the background. Progress prints in the window.
          6. Windows Firewall may ask permission; allow Private networks.
          7. The bridge prints one HTTPS pairing endpoint containing your private token plus a SHA-256 certificate pin.
          8. On iPhone open Vex -> Brain -> Web Brain -> Vex Bridge / SearXNG endpoint and paste the ENTIRE endpoint exactly as printed.
          9. Keep the bridge window open while Vex is using it.

          v0.7.5 adds intent routing: ordinary lookups and troubleshooting use web results only; explicit PC-file requests search local files; explicit combined requests can use both.
          The certificate pin trusts only this bridge certificate inside VexNative. You do not need to install or globally trust a homemade root certificate on the iPhone.
          New folders are discovered automatically on recurring background scans.
          Windows Console QuickEdit is disabled, so accidentally clicking the black window does not freeze Vex Bridge in "Select" mode.

          The bridge indexes useful text/code/JSON/CSV/HTML/RTF, DOCX and text-readable PDF files.
          The endpoint token is private. Do not post or share it publicly.
          "@ | Set-Content -Encoding UTF8 dist/README-VexBridge.txt

      - name: Package bridge zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VexBridge.exe,dist/README-VexBridge.txt -DestinationPath VexBridge-v0.7.5-Windows.zip -Force

      - name: Upload Windows bridge
        uses: actions/upload-artifact@v4
        with:
          name: VexBridge-v0.7.5-Windows
          path: VexBridge-v0.7.5-Windows.zip
          if-no-files-found: error
          retention-days: 7
