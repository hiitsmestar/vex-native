name: Build Vex Bridge Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "ci/v070-vex-bridge", "ci/v074-bridge-cert-pinning", "ci/v075-bridge-search-routing", "ci/v077-grounded-research", "ci/v079-camera-visual-replies" ]
    paths:
      - "Bridge/**"
      - "Tools/apply_v074_bridge_pairing_patch.py"
      - "Tools/apply_v075_search_routing_patch.py"
      - "Tools/apply_v076_direct_research_answers_patch.py"
      - "Tools/apply_v077_grounded_research_patch.py"
      - "Tools/apply_v078_photo_context_patch.py"
      - "Tools/apply_v079_camera_visual_replies_patch.py"
      - ".github/workflows/build-vex-bridge-windows.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "Bridge/**"
      - "Tools/apply_v074_bridge_pairing_patch.py"
      - "Tools/apply_v075_search_routing_patch.py"
      - "Tools/apply_v076_direct_research_answers_patch.py"
      - "Tools/apply_v077_grounded_research_patch.py"
      - "Tools/apply_v078_photo_context_patch.py"
      - "Tools/apply_v079_camera_visual_replies_patch.py"
      - ".github/workflows/build-vex-bridge-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-bridge:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bridge dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography

      - name: Apply v0.7.4 secure pairing patch
        run: |
          python Tools/apply_v074_bridge_pairing_patch.py

      - name: Apply v0.7.5 intent routing patch
        run: |
          python Tools/apply_v075_search_routing_patch.py
          Select-String -Path Bridge/vex_bridge.py -Pattern 'scope not in'

      - name: Apply v0.7.6 direct researched-answer prerequisites
        run: |
          python Tools/apply_v076_direct_research_answers_patch.py

      - name: Apply v0.7.7 grounded research patch
        run: |
          python Tools/apply_v077_grounded_research_patch.py
          Select-String -Path Bridge/vex_bridge.py -Pattern 'focused_web_excerpt'
          Select-String -Path Bridge/vex_bridge_full.py -Pattern 'VERSION = "0.7.7"'

      - name: Apply v0.7.8 photo prerequisites
        run: |
          python Tools/apply_v078_photo_context_patch.py

      - name: Apply v0.7.9 visual reply bridge patch
        run: |
          python Tools/apply_v079_camera_visual_replies_patch.py
          Select-String -Path Bridge/vex_bridge.py -Pattern 'web_image_search'
          Select-String -Path Bridge/vex_bridge.py -Pattern '/image-search'
          Select-String -Path Bridge/vex_bridge.py -Pattern '/image-proxy'
          Select-String -Path Bridge/vex_bridge_full.py -Pattern 'VERSION = "0.7.9"'

      - name: Syntax check bridge
        run: |
          python -m py_compile Bridge/vex_bridge.py Bridge/vex_bridge_full.py

      - name: Build standalone VexBridge.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexBridge `
            --paths Bridge `
            --collect-all cryptography `
            --hidden-import tkinter `
            --hidden-import vex_bridge `
            Bridge/vex_bridge_full.py
          if (!(Test-Path dist/VexBridge.exe)) { throw "VexBridge.exe was not created" }
          Get-Item dist/VexBridge.exe | Format-List Name,Length

      - name: Create quick-start text
        shell: pwsh
        run: |
          @"
          Vex Bridge v0.7.9 quick start
          ==============================

          1. Close any older VexBridge.exe window.
          2. Run this VexBridge.exe on the Windows PC.
          3. No folder selection is required. Vex automatically gets searchable access to user-readable fixed drives.
          4. The bridge comes online immediately and indexes files in the background.
          5. Windows Firewall may ask permission; allow Private networks.
          6. Keep the bridge window open while Vex is using it.
          7. Your existing paired endpoint should remain valid because the same private config and certificate are reused.

          v0.7.9 keeps grounded page research and adds web-image search plus a private image proxy so Vex can return clarification images directly inside chat.
          The bridge token remains private. Do not post or share it publicly.
          "@ | Set-Content -Encoding UTF8 dist/README-VexBridge.txt

      - name: Package bridge zip
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VexBridge.exe,dist/README-VexBridge.txt -DestinationPath VexBridge-v0.7.9-Windows.zip -Force

      - name: Upload Windows bridge
        uses: actions/upload-artifact@v4
        with:
          name: VexBridge-v0.7.9-Windows
          path: VexBridge-v0.7.9-Windows.zip
          if-no-files-found: error
          retention-days: 7
