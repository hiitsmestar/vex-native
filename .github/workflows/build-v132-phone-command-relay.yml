name: Build VexNative v0.13.2 Phone Command Relay

on:
  push:
    branches: [ "build/v132-phone-command-relay" ]
    paths:
      - "Tools/apply_v132_phone_command_relay.py"
      - "Tools/build_v132_phone_command_relay.py"
      - "Tools/VexPhoneRelay.py"
      - "Tools/VexPhoneCommand.py"
      - ".github/workflows/build-v132-phone-command-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-phone-relay:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Validate relay source
        run: python3 -m py_compile Tools/VexPhoneRelay.py Tools/VexPhoneCommand.py

      - name: Assemble v0.13.2
        run: python3 Tools/build_v132_phone_command_relay.py

      - name: Verify relay and inherited phone stack
        run: |
          grep -q 'V132_PHONE_COMMAND_RELAY = "v0.13.2-phone-command-relay-v1"' VexNative/ContentView.swift
          grep -q 'private final class PhoneRemoteCommandRelay' VexNative/ContentView.swift
          grep -q 'relayURL(path: "/phone/next")' VexNative/ContentView.swift
          grep -q 'relayURL(path: "/phone/result")' VexNative/ContentView.swift
          grep -q 'PhoneRemoteCommandRelay.shared.run(app: app)' VexNative/ContentView.swift
          grep -q 'PhoneToolRouter.tryHandle(routed, app: app)' VexNative/ContentView.swift
          grep -q 'parts.port = 8771' VexNative/ContentView.swift
          grep -q 'challenge.protectionSpace.port == 8771' VexNative/VexNativeApp.swift
          grep -q '\[8765, 8771\].contains(port)' VexNative/VexNativeApp.swift
          grep -q 'PCArtRouter.tryHandle' VexNative/ContentView.swift
          grep -q 'PhoneToolRouter.tryHandle' VexNative/ContentView.swift
          grep -q 'import Vision' VexNative/ContentView.swift
          grep -q 'CameraCaptureView' VexNative/ContentView.swift
          grep -q 'V127_INLINE_STAGE_DIRECTION_FIX_IOS = "v0.12.7-inline-stage-direction-v1"' VexNative/AppModel.swift

      - name: Resolve local Swift package
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VexDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=132 \
            MARKETING_VERSION=0.13.2 \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Add permissions and verify build identity
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string VexNative uses your local network to connect privately to paired Vex Bridge computers, memory, tools, runtime status, art, voice providers, and the phone command relay." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string VexNative uses the camera only when you choose camera features." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string VexNative uses the microphone while voice mode is enabled." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string VexNative uses speech recognition while voice mode is enabled so spoken words can become chat text." "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.13.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = "132"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.13.2-phone-command-relay.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/VexNative-v0.13.2-phone-command-relay.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.2-Phone-Command-Relay
          path: VexNative-v0.13.2-phone-command-relay.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.2-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
