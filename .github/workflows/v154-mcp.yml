name: v154 MCP checks

on:
  push:
    branches:
      - build/v154-chatgpt-brain-broker
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run v0.15.4 source checks
        run: python Tools/test_v154_mcp_server.py
