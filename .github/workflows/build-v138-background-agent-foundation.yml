name: Build VexNative v0.13.8 Background Agent Foundation

on:
  push:
    branches: [ "build/v138-background-agent-foundation" ]
    paths:
      - "Tools/apply_v138_background_agent_foundation.py"
      - "Tools/build_v138_background_agent_foundation.py"
      - ".github/workflows/build-v138-background-agent-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-background-agent:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Assemble v0.13.8
        run: python3 Tools/build_v138_background_agent_foundation.py

      - name: Verify background agent source
        run: |
          grep -q 'BGTaskScheduler.shared.register' VexNative/VexBackgroundAgent.swift
          grep -q 'VexPhoneBackgroundWorker.runOnce' VexNative/VexBackgroundAgent.swift
          grep -q 'VexHeadlessBrain.reply' VexNative/VexBackgroundAgent.swift
          grep -q '@UIApplicationDelegateAdaptor(VexAppDelegate.self)' VexNative/VexNativeApp.swift
          grep -q 'VexHeadlessBrain.reply(to: command)' VexNative/VexVoiceIntents.swift

      - name: Resolve local Swift package
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VexDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=138 \
            MARKETING_VERSION=0.13.8 \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Add background permissions and verify identity
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string fetch" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string processing" "$INFO_PLIST"

          /usr/libexec/PlistBuddy -c "Delete :BGTaskSchedulerPermittedIdentifiers" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers:0 string local.star.vexnative.background.refresh" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers:1 string local.star.vexnative.background.processing" "$INFO_PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string VexNative uses your local network to connect privately to your paired Vex computers and phone agent." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string VexNative uses the camera only for camera features you request." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string VexNative uses the microphone while voice mode is enabled." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string VexNative uses speech recognition while voice mode is enabled so spoken words can become commands." "$INFO_PLIST"

          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.13.8"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = "138"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")" = "Vex"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.13.8-background-agent-foundation.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/VexNative-v0.13.8-background-agent-foundation.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.8-Background-Agent-Foundation
          path: VexNative-v0.13.8-background-agent-foundation.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.8-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
