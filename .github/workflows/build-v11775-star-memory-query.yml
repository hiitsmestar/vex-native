name: Build Vex Agent Runtime v0.11.7.75 Star Memory Query

on:
  push:
    branches: [ "fix/v11775-star-memory-query" ]
    paths:
      - "Tools/apply_v11775_star_memory_query.py"
      - "Tools/ci_v11775_star_memory_query.py"
      - ".github/workflows/build-v11775-star-memory-query.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Build production Agent Runtime
        run: python Tools/ci_v11775_star_memory_query.py
      - name: Verify v0.11.7.75 Star memory query
        shell: python
        run: |
          from pathlib import Path
          b = Path("Bridge/vex_bridge.py").read_text(encoding="utf-8")
          i = Path("Tools/VexAgentRuntimeInstall.py").read_text(encoding="utf-8")
          assert '"agent_runtime_bundle": "0.11.7.75"' in b
          assert 'pc-memory-star-query-v11775' in b
          assert '"star",' in b and '"profile",' in b
          assert 'BUNDLE_VERSION = "0.11.7.75"' in i
          assert "standalone_remote.exists()" in i
          compile(b, "Bridge/vex_bridge.py", "exec")
          print("v0.11.7.75 Star memory query verified")
      - name: Upload v0.11.7.75 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.75-StarMemoryQuery
          path: Vex-Agent-Runtime-v0.11.7.75-StarMemoryQuery.zip
          if-no-files-found: error
          retention-days: 14
