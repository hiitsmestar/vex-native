name: Build Vex v0.11.7.40 Host Phone Ping

on:
  push:
    branches: [ "ci/v11731-windows-vex-host" ]
    paths:
      - "Tools/VexWindowsHost-v11735.py"
      - "Tools/apply_v11736_host_clipboard.py"
      - "Tools/apply_v11740_host_phone_ping.py"
      - ".github/workflows/build-v11740-host-phone-ping.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-host-phone-ping:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests
      - name: Build v0.11.7.40 source
        shell: pwsh
        run: |
          python Tools/apply_v11736_host_clipboard.py
          python Tools/apply_v11740_host_phone_ping.py
          python -m py_compile Tools/VexWindowsHost-v11740.py
          $src = Get-Content Tools/VexWindowsHost-v11740.py -Raw
          if (-not $src.Contains('VERSION = "0.11.7.40"')) { throw 'version marker missing' }
          if (-not $src.Contains('NTFY_SERVER = "https://ntfy.sh"')) { throw 'ntfy server marker missing' }
          if (-not $src.Contains('def send_phone_notification(')) { throw 'phone sender missing' }
          if (-not $src.Contains('text="Ping phone", command=self.ping_phone')) { throw 'Ping phone is not wired to sender' }
          if (-not $src.Contains('def ping_phone(')) { throw 'Ping phone handler missing' }
          if (-not $src.Contains('REMOTE_SUPPORT_STATE')) { throw 'saved local notification config route missing' }
          if (-not $src.Contains('text="Copy reply"')) { throw 'clipboard support regressed' }
          if (-not $src.Contains('bridge_post("/llm/chat"')) { throw 'PC Brain route regressed' }
          if (-not $src.Contains('self.after(5000, self.poll_status)')) { throw 'Bridge polling regressed' }
      - name: Verify unconfigured phone path is bounded
        shell: pwsh
        run: |
          @'
          import importlib.util
          from pathlib import Path
          p = Path('Tools/VexWindowsHost-v11740.py')
          spec = importlib.util.spec_from_file_location('vexhost40', p)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          ok, detail = mod.send_phone_notification('CI test')
          if ok:
              raise SystemExit('unexpected phone send without local topic')
          if 'configured' not in detail:
              raise SystemExit(f'unexpected bounded failure: {detail}')
          print('bounded phone notification config check passed')
          '@ | python -
      - name: Build Windows Host
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexWindowsHost --collect-all requests Tools/VexWindowsHost-v11740.py
      - name: Smoke test packaged Host
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\VexWindowsHost\VexWindowsHost.exe
          $p = Start-Process -FilePath $exe -WorkingDirectory .\dist\VexWindowsHost -PassThru
          Start-Sleep -Seconds 7
          $p.Refresh()
          if ($p.HasExited) { throw "VexWindowsHost exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process VexWindowsHost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Stage package
        shell: pwsh
        run: |
          $pkg='Vex-v0.11.7.40-PC-Brain-Host-Phone-Ping'
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Copy-Item dist\VexWindowsHost "$pkg\VexWindowsHost" -Recurse
          @'
          Vex v0.11.7.40 PC Brain Host Phone Ping
          ========================================
          Replaces only the Windows Host. Keep v0.11.7.39 Bridge installed.

          Adds:
          - Ping phone now sends through the already-configured local ntfy topic used by Vex Remote Support.
          - The ntfy topic remains local in %APPDATA%\VexRemoteSupport\state.json and is never packaged or committed.
          - Phone sending runs off the UI thread so the Host stays responsive.
          - Keeps v0.11.7.36 clipboard controls and v0.11.7.35 PC Brain routing.
          '@ | Set-Content -Encoding UTF8 "$pkg\README.txt"
          Compress-Archive -Path "$pkg\*" -DestinationPath Vex-v0.11.7.40-PC-Brain-Host-Phone-Ping.zip -Force
          Expand-Archive Vex-v0.11.7.40-PC-Brain-Host-Phone-Ping.zip -DestinationPath verify -Force
          if (!(Test-Path verify\VexWindowsHost\VexWindowsHost.exe)) { throw 'packaged host exe missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Vex-v0.11.7.40-PC-Brain-Host-Phone-Ping
          path: Vex-v0.11.7.40-PC-Brain-Host-Phone-Ping.zip
          retention-days: 14
