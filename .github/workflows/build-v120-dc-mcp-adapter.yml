name: Build Vex v0.12 Dual Brain + Desktop Commander

on:
  push:
    branches: [ "feature/dual-brain-router" ]
    paths:
      - "Tools/**"
      - "Bridge/**"
      - ".github/workflows/build-v120-dc-mcp-adapter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Build cumulative Full AI Runtime
        run: python Tools/ci_v120_full_ai_foundation.py

      - name: Re-freeze proven post-build runtime
        run: python Tools/ci_v120_postbuild_wants_proof.py

      - name: Apply final lifecycle, Desktop Commander, and dual-brain routing
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python Tools/apply_v120_learning_lifecycle.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tools/apply_v120_wants_capability_discovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tools/apply_v120_memory_singleton_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tools/apply_v120_desktop_commander_adapter.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tools/apply_v120_dual_brain_router.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tools/refreeze_v120_memory_worker.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:V120_POSTBUILD_SKIP_PATCHES = '1'
          python Tools/ci_v120_postbuild_wants_proof.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Desktop Commander and dual-brain contracts
        shell: python
        run: |
          from pathlib import Path
          bridge = Path("Bridge/vex_bridge.py").read_text(encoding="utf-8")
          adapter = Path("Tools/VexDesktopCommanderAdapter.mjs").read_text(encoding="utf-8")
          required = [
              'V120_DC_ADAPTER = "v0.12-desktop-commander-mcp-v1"',
              '"desktop_commander"',
              'tool.startswith("dc.")',
              '"dc.list_processes"',
              'provider": "desktop-commander-mcp"',
              'V120_DUAL_BRAIN_ROUTER = "v0.12-dual-brain-v2"',
              'V120_FAST_MODEL = "vex-qwen3-4b:latest"',
              'V120_DEEP_MODEL = "vex-qwen35-a3b-text:latest"',
              'V120_DEEP_URL',
              'def _v120_deep_chat',
              'def _v120_fast_ollama_chat',
              'def _ollama_chat',
          ]
          for marker in required:
              assert marker in bridge, marker
          for marker in ["desktop-commander.cmd", "read-only", "127.0.0.1"]:
              assert marker in adapter, marker
          compile(bridge, "Bridge/vex_bridge.py", "exec")
          z = Path("Vex-Agent-Runtime-v0.12.0-FullAIFoundation.zip")
          assert z.exists() and z.stat().st_size > 100_000
          print("PASS Desktop Commander + bounded 4B/direct-35B router + v0.12 artifact")

      - name: Upload dual-brain Desktop Commander runtime
        uses: actions/upload-artifact@v7
        with:
          name: Vex-Agent-Runtime-v0.12.0-DualBrain-DesktopCommander
          path: Vex-Agent-Runtime-v0.12.0-FullAIFoundation.zip
          if-no-files-found: error
          retention-days: 14
