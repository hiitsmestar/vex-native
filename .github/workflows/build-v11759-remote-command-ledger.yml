name: Build Vex Remote Support v0.11.7.59 Command Ledger

on:
  push:
    branches: [ "fix/v11759-remote-command-ledger" ]
    paths:
      - "Tools/apply_v11759_remote_command_ledger.py"
      - "Tools/test_v11759_remote_command_ledger.py"
      - ".github/workflows/build-v11759-remote-command-ledger.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-remote-support:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Reassemble exact proven v0.11.7.57 runtime source
        run: python Tools/ci_v11757_autonomous_research_evidence_loop.py

      - name: Apply v0.11.7.58 relay tail fix
        run: python Tools/apply_v11758_remote_relay_tail_pagination.py

      - name: Prove v0.11.7.58 relay pagination
        run: python Tools/test_v11758_remote_relay_tail_pagination.py

      - name: Apply durable command ledger and worklog
        run: python Tools/apply_v11759_remote_command_ledger.py

      - name: Prove command pickup is cursor-independent
        run: python Tools/test_v11759_remote_command_ledger.py

      - name: Build Remote Support v0.11.7.59
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build/remote59,dist/remote59 -ErrorAction SilentlyContinue
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name VexRemoteSupport `
            --distpath dist/remote59 `
            --workpath build/remote59 `
            --collect-all requests `
            Tools/VexRemoteSupport.py
          if (!(Test-Path dist/remote59/VexRemoteSupport.exe)) { throw "VexRemoteSupport.exe missing" }

      - name: Build matching Doctor companion
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexDoctor `
            --distpath dist/remote59 `
            --workpath build/doctor59 `
            --collect-all requests `
            Tools/VexDoctor.py
          if (!(Test-Path dist/remote59/VexDoctor.exe)) { throw "VexDoctor.exe missing" }

      - name: Package Remote Support
        shell: pwsh
        run: |
          @'
          Vex Remote Support v0.11.7.59 Command Ledger
          ============================================

          Built forward from the proven v0.11.7.57 Agent Runtime and v0.11.7.58 relay-tail fix.

          Fixes:
          - command pickup no longer depends on the shared last_comment_id cursor
          - processed command IDs are persisted and bounded to prevent duplicate mutating commands
          - newest relay pages are scanned every poll
          - session starts and command completions append sanitized continuity entries to issue #79

          Run VexRemoteSupport.exe. The existing single-instance/cutover behavior is preserved.
          '@ | Set-Content -Encoding UTF8 dist/remote59/README-VexRemoteSupport-v0.11.7.59.txt
          Compress-Archive -Path dist/remote59/VexRemoteSupport.exe,dist/remote59/VexDoctor.exe,dist/remote59/README-VexRemoteSupport-v0.11.7.59.txt -DestinationPath VexRemoteSupport-v0.11.7.59-CommandLedger.zip -Force
          if (!(Test-Path VexRemoteSupport-v0.11.7.59-CommandLedger.zip)) { throw "Remote Support zip missing" }

      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: VexRemoteSupport-v0.11.7.59-CommandLedger
          path: VexRemoteSupport-v0.11.7.59-CommandLedger.zip
          if-no-files-found: error
          retention-days: 14
