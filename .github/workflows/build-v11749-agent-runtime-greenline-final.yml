name: Build Vex Agent Runtime v0.11.7.49 Greenline Final

# Single authoritative Agent Runtime build lane. Historical brittle lanes were retired.
on:
  push:
    branches: [ "feat/vex-agent-runtime-windows-v1" ]
    paths:
      - "Tools/ci_v11749_greenline.py"
      - "Tools/apply_v11749_agent_runtime_foundation.py"
      - ".github/workflows/build-v11749-agent-runtime-greenline-final.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-agent-runtime-greenline-final:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Build and prove Agent Runtime
        run: python Tools/ci_v11749_greenline.py

      - name: Upload proven Agent Runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.49-Greenline
          path: Vex-Agent-Runtime-v0.11.7.49-Greenline.zip
          if-no-files-found: error
          retention-days: 14
