name: Build Vex Bridge v0.9.3 Windows

on:
  workflow_dispatch:
  push:
    branches: [ "ci/v093-cognition-overlay" ]
  pull_request:
    branches: [ "ci/v092-device-control-reliability" ]

permissions:
  contents: read

jobs:
  build-windows-bridge:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp
          python -c "import requests, edge_tts, yt_dlp; from winrt.windows.media.control import GlobalSystemMediaTransportControlsSessionManager; print('Bridge dependencies OK')"
      - name: Apply secure pairing
        run: python Tools/apply_v074_bridge_pairing_patch.py
      - name: Apply search routing
        run: python Tools/apply_v075_search_routing_patch.py
      - name: Apply direct-answer prerequisites
        run: python Tools/apply_v076_direct_research_answers_patch.py
      - name: Apply grounded web research
        run: python Tools/apply_v077_grounded_research_patch.py
      - name: Apply photo prerequisites
        run: python Tools/apply_v078_photo_context_patch.py
      - name: Apply visual replies
        run: |
          python Tools/apply_v079_camera_visual_replies_patch.py
          python Tools/apply_v079_compile_hotfix.py
      - name: Apply visual routing/viewer prerequisites
        run: |
          python Tools/apply_v0710_visual_intent_fix.py
          python Tools/apply_v0711_zoomable_chat_images.py
      - name: Prepare v0.8.2 patch chain
        run: python Tools/prepare_v082_build_chain.py
      - name: Apply hybrid PC expansion brain
        run: python Tools/apply_v080_hybrid_brain_patch.py
      - name: Apply dual-PC mesh
        run: python Tools/apply_v081_dual_pc_mesh_patch.py
      - name: Apply grounded PC tools
        run: python Tools/apply_v082_pc_tools_capability_patch.py
      - name: Apply browser and URL tools
        run: python Tools/apply_v083_browser_url_tools_patch.py
      - name: Apply self-learning safe skills
        run: |
          python Tools/apply_v084_self_learning_skills_patch.py
          python Tools/apply_v084_skill_resolution_order_hotfix.py
      - name: Apply safe workflow compiler
        run: python Tools/apply_v085_skill_compiler_patch.py
      - name: Apply media controls
        run: python Tools/apply_v086_bridge_media_patch.py
      - name: Apply neural TTS and verified named media
        run: python Tools/apply_v090_bridge_neural_media_patch.py
      - name: Apply v0.9.1 YouTube context control
        run: python Tools/apply_v091_youtube_context_bridge_patch.py
      - name: Apply v0.9.2 Windows controls
        run: python Tools/apply_v092_bridge_control_patch.py
      - name: Apply v0.9.3 cognition overlay
        run: |
          python Tools/apply_v093_cognition_bridge_patch.py
          Select-String -Path Bridge/vex_bridge.py -Pattern 'VEX_COGNITION_SYSTEM'
          Select-String -Path Bridge/vex_bridge.py -Pattern 'parsed.path == "/llm/chat"'
          Select-String -Path Bridge/vex_bridge.py -Pattern 'parsed.path == "/llm/status"'
          Select-String -Path Bridge/vex_bridge_full.py -Pattern 'VERSION = "0.9.3"'
      - name: Parser and syntax checks
        shell: pwsh
        run: |
          python -c "import sys; sys.path.insert(0, 'Bridge'); import vex_bridge as v; assert 'open_url' in v.PC_TOOL_ACTIONS; assert hasattr(v, '_ollama_chat'); assert hasattr(v, '_choose_ollama_model'); print('v0.9.3 cognition imports OK')"
          python -m py_compile Bridge/vex_bridge.py Bridge/vex_bridge_full.py
      - name: Build standalone VexBridge.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexBridge `
            --paths Bridge `
            --collect-all cryptography `
            --collect-all edge_tts `
            --collect-all yt_dlp `
            --hidden-import tkinter `
            --hidden-import vex_bridge `
            --hidden-import winrt.windows.media.control `
            Bridge/vex_bridge_full.py
          if (!(Test-Path dist/VexBridge.exe)) { throw "VexBridge.exe was not created" }
      - name: Create cognition overlay guide
        shell: pwsh
        run: |
          @"
          Vex cognition overlay v0.9.3
          ============================

          This package contains two independent upgrades:

          1. VexBridge.exe v0.9.3
             Replace the old VexBridge.exe on both paired PCs. Existing pairing
             tokens, certificate pins, memory/index state, skills and voice settings
             remain in AppData.

          2. VexBrainSetup.ps1 (optional but recommended)
             Run this on at least one paired Windows PC. It installs/uses Ollama and
             downloads qwen3:4b as a stronger local conversation model. The model is
             not exposed directly to your LAN; VexNative reaches it only through the
             authenticated, certificate-pinned Vex Bridge.

          Without the setup script, every normal VexNative feature still works and
          the iPhone falls back to its onboard Qwen model. With it, casual reasoning,
          continuity, natural text and spoken replies can use the stronger PC model.

          The iPhone v0.9.3 app also has a new contextual browser controller. Commands
          like "open YouTube on the downstairs computer" and follow-ups like "open
          YouTube in that browser you just opened" are resolved before the tiny model.
          It probes the paired Bridge nodes, retries the alternate node for safe browser
          actions, remembers the working downstairs/upstairs mapping, and reports real
          node/version diagnostics instead of the old generic failure.

          This is a local open-model cognition layer; it is not a copy of ChatGPT or
          OpenAI model weights.
          "@ | Set-Content -Encoding UTF8 dist/README-VexBridge-v0.9.3.txt
          Copy-Item Tools/VexBrainSetup.ps1 dist/VexBrainSetup.ps1
      - name: Package bridge and brain setup
        shell: pwsh
        run: |
          Compress-Archive -Path dist/VexBridge.exe,dist/VexBrainSetup.ps1,dist/README-VexBridge-v0.9.3.txt -DestinationPath VexBridge-v0.9.3-Windows.zip -Force
          Expand-Archive -Path VexBridge-v0.9.3-Windows.zip -DestinationPath "$env:RUNNER_TEMP\bridge-check" -Force
          if (!(Test-Path "$env:RUNNER_TEMP\bridge-check\VexBridge.exe")) { throw "Bridge ZIP integrity check failed" }
          if (!(Test-Path "$env:RUNNER_TEMP\bridge-check\VexBrainSetup.ps1")) { throw "Brain setup script missing from ZIP" }
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: VexBridge-v0.9.3-Windows-Cognition
          path: VexBridge-v0.9.3-Windows.zip
          if-no-files-found: error
          retention-days: 7
