name: Build Vex v0.11.7.29 Defender Safe Windows

on:
  push:
    branches: [ "ci/v11729-defender-safe-windows" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Apply proven v0.11.7.28 single-supervisor chain
        shell: pwsh
        run: python Tools/build_v11728_chain.py
      - name: Apply v0.11.7.29 Defender-safe packaging patch
        shell: pwsh
        run: python Tools/apply_v11729_windows_defender_safe.py
      - name: Verify v0.11.7.29 source invariants
        shell: pwsh
        run: |
          python -m py_compile Bridge/vex_bridge.py Tools/VexRemoteSupport.py Tools/VexDoctor.py Tools/VexInstall11722.py Tools/apply_v11729_windows_defender_safe.py
          $bridge = Get-Content Bridge/vex_bridge.py -Raw
          $remote = Get-Content Tools/VexRemoteSupport.py -Raw
          $installer = Get-Content Tools/VexInstall11722.py -Raw
          if (-not $bridge.Contains('"version": "0.11.7.29"')) { throw 'Bridge v0.11.7.29 marker missing' }
          if (-not $remote.Contains('VERSION = "0.11.7.29"')) { throw 'Remote v0.11.7.29 marker missing' }
          if (-not $installer.Contains("VERSION='0.11.7.29'")) { throw 'Installer v0.11.7.29 marker missing' }
          if (-not $installer.Contains("REMOTE_RUNTIME_DIR='VexRemoteSupportRuntime'")) { throw 'one-folder runtime installer marker missing' }
          if ($installer.Contains("subprocess.Popen([str(home/'VexRemoteSupport.exe')]")) { throw 'legacy standalone Remote Support launch remains' }
          if (-not $installer.Contains('retire_legacy_supervisors(home)')) { throw 'single-supervisor retirement missing' }
      - name: Build Windows binaries
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --noupx --windowed --name VexBridge --collect-all requests --collect-all bs4 --collect-all pypdf --collect-all cryptography Bridge/vex_bridge.py
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexRemoteSupport --collect-all requests Tools/VexRemoteSupport.py
          pyinstaller --noconfirm --clean --onefile --noupx --console --name VexDoctor --collect-all requests Tools/VexDoctor.py
          pyinstaller --noconfirm --clean --onefile --noupx --windowed --name Install-Vex-v0.11.7.29 Tools/VexInstall11722.py
      - name: Smoke test Remote Support one-folder single instance
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\VexRemoteSupport\VexRemoteSupport.exe
          $a = Start-Process -FilePath $exe -WorkingDirectory .\dist\VexRemoteSupport -PassThru
          Start-Sleep -Seconds 8
          $a.Refresh()
          if ($a.HasExited) { throw "First VexRemoteSupport exited during GUI startup with code $($a.ExitCode)" }
          $b = Start-Process -FilePath $exe -WorkingDirectory .\dist\VexRemoteSupport -PassThru
          Start-Sleep -Seconds 7
          $b.Refresh()
          if (-not $b.HasExited) { throw 'Second VexRemoteSupport instance remained alive' }
          Stop-Process -Id $a.Id -Force -ErrorAction SilentlyContinue
          Get-Process VexRemoteSupport -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Smoke test Bridge runtime
        shell: pwsh
        run: |
          Get-Process VexBridge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $a = Start-Process -FilePath .\dist\VexBridge.exe -PassThru
          Start-Sleep -Seconds 10
          $baseline = @(Get-Process VexBridge -ErrorAction SilentlyContinue).Count
          if ($baseline -lt 1) { throw 'First VexBridge did not remain alive' }
          $b = Start-Process -FilePath .\dist\VexBridge.exe -PassThru
          $deadline = (Get-Date).AddSeconds(25)
          do {
            Start-Sleep -Seconds 1
            $after = @(Get-Process VexBridge -ErrorAction SilentlyContinue).Count
          } while ($after -gt $baseline -and (Get-Date) -lt $deadline)
          if ($after -gt $baseline) { throw "Second Bridge launch left a sustained extra process set: baseline=$baseline after=$after" }
          Get-Process VexBridge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Stage and verify install package
        shell: pwsh
        run: |
          $pkg = 'Vex-v0.11.7.29-Defender-Safe'
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Copy-Item dist\VexBridge.exe "$pkg\VexBridge.exe"
          Copy-Item dist\VexDoctor.exe "$pkg\VexDoctor.exe"
          Copy-Item dist\Install-Vex-v0.11.7.29.exe "$pkg\Install-Vex-v0.11.7.29.exe"
          Copy-Item dist\VexRemoteSupport "$pkg\VexRemoteSupportRuntime" -Recurse
          @'
          Vex v0.11.7.29 - Defender-Safe True Single Supervisor
          =======================================================
          - Preserves the proven v0.11.7.28 single-supervisor cutover.
          - Remote Support is packaged as a non-UPX PyInstaller one-folder runtime instead of a self-extracting one-file executable.
          - Retires the old standalone Remote Support executable during install.
          - Legacy PowerShell watchdog/self-heal launchers remain retired; Remote Support owns Bridge recovery.
          - Bridge, Doctor, installer, mutex protection, patient health timing, and runtime identity verification are retained.

          Extract this ZIP, keep the VexRemoteSupportRuntime folder beside the installer, then run Install-Vex-v0.11.7.29.exe.
          '@ | Set-Content -Encoding UTF8 "$pkg\README-Vex-v0.11.7.29.txt"
          if (!(Test-Path "$pkg\VexRemoteSupportRuntime\VexRemoteSupport.exe")) { throw 'Remote Support runtime missing' }
          if (!(Test-Path "$pkg\Install-Vex-v0.11.7.29.exe")) { throw 'installer missing' }
          if (Get-ChildItem $pkg -Filter '*Watchdog*' -Recurse) { throw 'legacy watchdog leaked into package' }
          Compress-Archive -Path "$pkg\*" -DestinationPath Vex-v0.11.7.29-Defender-Safe.zip -Force
          Expand-Archive Vex-v0.11.7.29-Defender-Safe.zip -DestinationPath verify-package -Force
          if (!(Test-Path verify-package\VexRemoteSupportRuntime\VexRemoteSupport.exe)) { throw 'verified ZIP Remote Support runtime missing' }
          if (!(Test-Path verify-package\Install-Vex-v0.11.7.29.exe)) { throw 'verified ZIP installer missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Vex-v0.11.7.29-Defender-Safe
          path: Vex-v0.11.7.29-Defender-Safe.zip
          retention-days: 14
