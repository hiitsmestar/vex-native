name: Build Vex Remote Support v0.9.9.2

on:
  push:
    branches: [ "ci/v099-remote-support" ]
  pull_request:
    branches: [ "ci/v098-modular-toolbox" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography

      - name: Verify source
        shell: pwsh
        run: |
          python Tools/fix_v099_remote_support_syntax.py
          python Tools/apply_v0991_ntfy_patch.py
          python Tools/apply_v0992_ntfy_header_fix.py
          python -m py_compile Tools/VexRemoteSupport.py Tools/VexDoctor.py Tools/fix_v099_remote_support_syntax.py Tools/apply_v0991_ntfy_patch.py Tools/apply_v0992_ntfy_header_fix.py
          python -c "from pathlib import Path; t=Path('Tools/VexRemoteSupport.py').read_text(encoding='utf-8'); assert 'ISSUE_NUMBER = 52' in t; assert 'local safe-maintenance permission is OFF' in t; assert 'technical topics only' in t; assert 'SESSION_SECONDS = 2 * 60 * 60' in t; assert '0.9.9.2' in t; assert 'https://ntfy.sh' in t; assert 'Title\": f\"Vex - {label}' in t; assert 'Test phone ping' in t; print('Vex Remote Support v0.9.9.2 source checks OK')"

      - name: Build Vex Remote Support
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name VexRemoteSupport `
            --collect-all requests `
            Tools/VexRemoteSupport.py
          if (!(Test-Path dist/VexRemoteSupport.exe)) { throw "VexRemoteSupport.exe missing" }

      - name: Build Vex Doctor companion
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexDoctor `
            --collect-all requests `
            Tools/VexDoctor.py
          if (!(Test-Path dist/VexDoctor.exe)) { throw "VexDoctor.exe missing" }

      - name: Package remote support
        shell: pwsh
        run: |
          @'
          Vex Remote Support v0.9.9.2
          ===========================

          PURPOSE
          - Opt-in GitHub relay for sanitized Vex diagnostics, technical learning,
            and explicitly allowed safe maintenance.
          - Optional iPhone completion notifications through ntfy.sh.
          - v0.9.9.2 fixes the Windows ntfy Title-header encoding bug that caused
            test notifications to fail before leaving the PC.
          - It is NOT arbitrary remote desktop and does NOT expose a shell.

          FIRST RUN
          1. Double-click VexRemoteSupport.exe.
          2. Press Set Up GitHub if GitHub has not already been authenticated.
          3. Press Test GitHub.
          4. Enter/save the ntfy topic or use Star's preconfigured sidecar package.
          5. Press Test phone ping.
          6. Press Start 2-Hour Session.

          PRIVACY / SAFETY
          The relay publishes sanitized technical state only. It never publishes
          Bridge tokens, IP addresses, usernames, personal paths, filenames, chat
          contents, ntfy topics, or personal data.

          Remote mutating maintenance still requires Star to check the local
          "Allow remote SAFE maintenance" box.
          '@ | Set-Content -Encoding UTF8 dist/README-VexRemoteSupport-v0.9.9.2.txt

          Compress-Archive `
            -Path dist/VexRemoteSupport.exe,dist/VexDoctor.exe,dist/README-VexRemoteSupport-v0.9.9.2.txt `
            -DestinationPath VexRemoteSupport-v0.9.9.2.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: VexRemoteSupport-v0.9.9.2
          path: VexRemoteSupport-v0.9.9.2.zip
          retention-days: 7
