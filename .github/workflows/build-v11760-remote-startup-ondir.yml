name: Build Vex Remote Support v0.11.7.60 Startup Onedir Fix

on:
  push:
    branches: [ "fix/v11760-remote-startup-ondir" ]
    paths:
      - "Tools/apply_v11760_remote_startup_ondir.py"
      - "Tools/trigger_v11760_build.txt"
      - ".github/workflows/build-v11760-remote-startup-ondir.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-remote-support:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Reassemble proven v0.11.7.57 source
        run: python Tools/ci_v11757_autonomous_research_evidence_loop.py
      - name: Apply v0.11.7.58 relay fix
        run: python Tools/apply_v11758_remote_relay_tail_pagination.py
      - name: Apply v0.11.7.59 command ledger and worklog
        run: python Tools/apply_v11759_remote_command_ledger.py
      - name: Apply v0.11.7.60 frozen startup fix
        run: python Tools/apply_v11760_remote_startup_ondir.py
      - name: Prove source startup
        shell: pwsh
        run: |
          $p = Start-Process python -ArgumentList 'Tools/VexRemoteSupport.py' -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "v0.11.7.60 source exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Build Defender-safe one-folder Remote Support
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force build/remote60,dist/remote60 -ErrorAction SilentlyContinue
          pyinstaller --noconfirm --clean --onedir --noupx --windowed `
            --name VexRemoteSupport `
            --distpath dist/remote60 `
            --workpath build/remote60 `
            --collect-all requests `
            Tools/VexRemoteSupport.py
          if (!(Test-Path dist/remote60/VexRemoteSupport/VexRemoteSupport.exe)) { throw "VexRemoteSupport.exe missing" }
      - name: Prove exact packaged executable startup
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/remote60/VexRemoteSupport/VexRemoteSupport.exe'
          $p = Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) {
            $err = Join-Path $env:APPDATA 'VexRemoteSupport/startup-crash.log'
            if (Test-Path $err) { Write-Host '=== STARTUP ERROR ==='; Get-Content $err }
            throw "Packaged v0.11.7.60 exited during startup with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Packaged v0.11.7.60 remained alive for 10 seconds'
      - name: Build matching Doctor companion
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexDoctor `
            --distpath dist/remote60 `
            --workpath build/doctor60 `
            --collect-all requests `
            Tools/VexDoctor.py
          if (!(Test-Path dist/remote60/VexDoctor.exe)) { throw "VexDoctor.exe missing" }
      - name: Package install-ready Remote Support
        shell: pwsh
        run: |
          @'
          Vex Remote Support v0.11.7.60 Startup Onedir Fix
          =================================================

          Built forward from the proven v0.11.7.57 runtime, v0.11.7.58 relay-tail fix,
          and v0.11.7.59 durable command ledger/worklog.

          This restores the Defender-safer one-folder Remote Support packaging introduced
          earlier in the runtime line and proves the exact packaged executable remains
          alive on Windows before publishing the artifact.

          Run VexRemoteSupport.exe inside the VexRemoteSupport folder. Keep that whole
          folder together. The command ledger and issue #79 continuity worklog remain active.
          '@ | Set-Content -Encoding UTF8 dist/remote60/README-VexRemoteSupport-v0.11.7.60.txt
          $pkg='VexRemoteSupport-v0.11.7.60-StartupOnedirFix'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Recurse dist/remote60/VexRemoteSupport "$pkg/VexRemoteSupport"
          Copy-Item dist/remote60/VexDoctor.exe "$pkg/VexDoctor.exe"
          Copy-Item dist/remote60/README-VexRemoteSupport-v0.11.7.60.txt "$pkg/README-VexRemoteSupport-v0.11.7.60.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip" -Force
          if (!(Test-Path "$pkg.zip")) { throw "Remote Support zip missing" }
      - name: Upload install artifact
        uses: actions/upload-artifact@v4
        with:
          name: VexRemoteSupport-v0.11.7.60-StartupOnedirFix
          path: VexRemoteSupport-v0.11.7.60-StartupOnedirFix.zip
          if-no-files-found: error
          retention-days: 14
