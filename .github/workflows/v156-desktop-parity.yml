name: v156 Desktop Parity checks
on:
  push:
    branches:
      - build/v156-desktop-parity
  workflow_dispatch:
jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parity runtime
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "v156-install.out.log"
          $err = Join-Path $env:RUNNER_TEMP "v156-install.err.log"
          $script = (Resolve-Path ".\Tools\Install-VexDesktopParity.ps1").Path
          $proc = Start-Process powershell.exe -ArgumentList @(
            "-NoProfile","-ExecutionPolicy","Bypass","-File",$script,"-Mode","Both","-NoLan"
          ) -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (!$proc.WaitForExit(600000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $out) { Get-Content $out }
            if (Test-Path $err) { Get-Content $err }
            throw "Install-VexDesktopParity exceeded 600 seconds."
          }
          $proc.WaitForExit()
          $proc.Refresh()
          if (Test-Path $out) { Get-Content $out }
          if (Test-Path $err) { Get-Content $err }
          $successMarker = $false
          if (Test-Path $out) {
            $successMarker = [bool](Select-String -Path $out -SimpleMatch "Vex Desktop Parity v0.15.6 installed and verified." -Quiet)
          }
          if (($null -ne $proc.ExitCode -and $proc.ExitCode -ne 0) -or !$successMarker) {
            throw "Install-VexDesktopParity did not complete successfully."
          }
      - name: Install Dropbox bridge
        shell: powershell
        run: .\Tools\Install-VexDropboxParityBridge.ps1 -DropboxRoot "$env:RUNNER_TEMP\VexRemoteBridge"
      - name: Run parity checks
        shell: powershell
        run: .\Tools\Test-VexDesktopParity.ps1
