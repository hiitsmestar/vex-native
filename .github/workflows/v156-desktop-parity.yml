name: v156 Desktop Parity checks
on:
  push:
    branches:
      - build/v156-desktop-parity
  workflow_dispatch:
jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parity runtime
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP "v156-install.out.log"
          $err = Join-Path $env:RUNNER_TEMP "v156-install.err.log"
          $script = (Resolve-Path ".\Tools\Install-VexDesktopParity.ps1").Path
          $proc = Start-Process powershell.exe -ArgumentList @(
            "-NoProfile","-ExecutionPolicy","Bypass","-File",$script,"-Mode","Both","-NoLan"
          ) -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          if (!$proc.WaitForExit(600000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path $out) { Get-Content $out }
            if (Test-Path $err) { Get-Content $err }
            throw "Install-VexDesktopParity exceeded 600 seconds."
          }
          $proc.WaitForExit()
          $proc.Refresh()
          if (Test-Path $out) { Get-Content $out }
          if (Test-Path $err) { Get-Content $err }
          $successMarker = $false
          if (Test-Path $out) {
            $successMarker = [bool](Select-String -Path $out -SimpleMatch "Vex Desktop Parity v0.15.6 installed and verified." -Quiet)
          }
          if (($null -ne $proc.ExitCode -and $proc.ExitCode -ne 0) -or !$successMarker) {
            throw "Install-VexDesktopParity did not complete successfully."
          }
      - name: Install Dropbox bridge
        shell: powershell
        run: .\Tools\Install-VexDropboxParityBridge.ps1 -DropboxRoot "$env:RUNNER_TEMP\VexRemoteBridge"
      - name: Run Dropbox bridge end-to-end
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "VexRemoteBridge"
          $commands = Join-Path $root "commands"
          $results = Join-Path $root "results"
          function Send-VexCommand {
            param([string]$Id, [string]$Tool, [hashtable]$Arguments)
            $payload = @{ request_id = $Id; tool = $Tool; arguments = $Arguments } | ConvertTo-Json -Depth 10
            $path = Join-Path $commands ($Id + ".json")
            [IO.File]::WriteAllText($path, $payload, (New-Object Text.UTF8Encoding($false)))
            $resultPath = Join-Path $results ($Id + ".json")
            $deadline = (Get-Date).AddSeconds(30)
            while (!(Test-Path $resultPath) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
            if (!(Test-Path $resultPath)) { throw "Timed out waiting for Dropbox bridge result: $Id" }
            $result = Get-Content -Raw $resultPath | ConvertFrom-Json
            if (!$result.ok) { throw "Dropbox bridge command failed: $Id :: $($result.error)" }
            if ($result.result.isError -eq $true) { throw "MCP tool returned an error: $Id" }
            return $result
          }

          $devices = Send-VexCommand -Id "ci-list-devices" -Tool "list_devices" -Arguments @{}
          $textPart = @($devices.result.content | Where-Object { $_.type -eq "text" })[0].text
          $deviceList = ($textPart | ConvertFrom-Json).devices
          if (!$deviceList -or $deviceList.Count -lt 1) { throw "Dropbox bridge hub returned no devices." }
          $deviceId = [string]$deviceList[0].deviceId

          $cfg = Send-VexCommand -Id "ci-get-config" -Tool "get_config" -Arguments @{ deviceId = $deviceId }
          if (!$cfg.result.content) { throw "Dropbox bridge routed get_config returned no content." }

          $probe = Join-Path $env:RUNNER_TEMP "vex-dropbox-e2e.txt"
          $write = Send-VexCommand -Id "ci-write-file" -Tool "write_file" -Arguments @{
            deviceId = $deviceId
            path = $probe
            content = "vex-dropbox-parity-ok"
            mode = "rewrite"
          }
          if (!(Test-Path $probe)) { throw "Dropbox bridge write_file did not create the probe file." }
          if ((Get-Content -Raw $probe) -notmatch "vex-dropbox-parity-ok") { throw "Dropbox bridge probe content mismatch." }
          Write-Host "PASS Dropbox bridge end-to-end routed command execution."

      - name: Run parity checks
        shell: powershell
        run: .\Tools\Test-VexDesktopParity.ps1
