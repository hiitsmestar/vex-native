name: Build Vex Agent Runtime v0.11.7.56 Remote Doctor Startup Probe Hotfix

on:
  push:
    branches: [ "feat/vex-agent-runtime-windows-v1" ]
    paths:
      - "Tools/apply_v11756_remote_doctor_startup_probe_hotfix.py"
      - "Tools/ci_v11756_remote_doctor_startup_probe_hotfix.py"
      - "Tools/test_v11756_remote_doctor_startup_probe_hotfix.py"
      - "Tools/test_v11756_learning_windows_regression.py"
      - "Tools/test_v11756_memory_regression.py"
      - ".github/workflows/build-v11756-remote-doctor-startup-probe-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v11756-remote-doctor-startup-probe-hotfix:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Build and prove production Agent Runtime
        run: python Tools/ci_v11756_remote_doctor_startup_probe_hotfix.py

      - name: Preserve autonomous anti-spam and Windows interactive recovery
        run: python Tools/test_v11756_learning_windows_regression.py

      - name: Prove Remote Doctor lookup and startup capability retry
        run: python Tools/test_v11756_remote_doctor_startup_probe_hotfix.py

      - name: Preserve installer self-home field hotfix
        run: python Tools/test_v11754_installer_self_home_hotfix.py

      - name: Prove memory write correction and fresh recall survived
        run: python Tools/test_v11756_memory_regression.py

      - name: Upload proven v0.11.7.56 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.56-RemoteDoctor-StartupProbe-Hotfix
          path: Vex-Agent-Runtime-v0.11.7.56-RemoteDoctor-StartupProbe-Hotfix.zip
          if-no-files-found: error
          retention-days: 14
