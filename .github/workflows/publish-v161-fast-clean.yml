name: Publish VexNative v0.16.1 Fast Clean Repair

on:
  push:
    branches: [ "repair/v161-fast-clean-20261002" ]
    paths:
      - ".github/workflows/publish-v161-fast-clean.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Assemble
        run: python3 Tools/build_v161_unified_core_client.py
      - name: Resolve packages
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies
      - name: Build
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild -project VexNative.xcodeproj -scheme VexNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/VexDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" CURRENT_PROJECT_VERSION=161 MARKETING_VERSION=0.16.1 build
      - name: Package
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.16.1-fast-clean.ipa" Payload
      - name: Publish repair IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.16.1-fast-clean-repair
          name: VexNative v0.16.1 Fast Clean Repair
          prerelease: true
          make_latest: false
          files: VexNative-v0.16.1-fast-clean.ipa
