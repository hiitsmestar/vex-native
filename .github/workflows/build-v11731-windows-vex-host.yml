name: Build Vex v0.11.7.33 Unified Windows Host

on:
  push:
    branches: [ "ci/v11731-windows-vex-host" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-host:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests
      - name: Verify source
        shell: pwsh
        run: |
          python -m py_compile Tools/VexWindowsHost.py Tools/VexNodeAgent.py
          $host = Get-Content Tools/VexWindowsHost.py -Raw
          $node = Get-Content Tools/VexNodeAgent.py -Raw
          if (-not $host.Contains('VERSION = "0.11.7.33"')) { throw 'host version marker missing' }
          if (-not $host.Contains('HOST_PORT = 8768')) { throw 'relay port marker missing' }
          if (-not $host.Contains('/node/register')) { throw 'node registration missing' }
          if (-not $host.Contains('/node/ping')) { throw 'node ping missing' }
          if (-not $host.Contains('local_control_port')) { throw 'local Bridge control route missing' }
          if (-not $node.Contains('VERSION = "0.11.7.33"')) { throw 'node version marker missing' }
          if (-not $node.Contains('X-Vex-Node-Token')) { throw 'node auth missing' }
      - name: Build Windows host and node agent
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexWindowsHost --collect-all requests Tools/VexWindowsHost.py
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexNodeAgent Tools/VexNodeAgent.py
      - name: Smoke test host and node processes
        shell: pwsh
        run: |
          $host = Resolve-Path .\dist\VexWindowsHost\VexWindowsHost.exe
          $hp = Start-Process -FilePath $host -WorkingDirectory .\dist\VexWindowsHost -PassThru
          Start-Sleep -Seconds 6
          $hp.Refresh()
          if ($hp.HasExited) { throw "VexWindowsHost exited during startup with code $($hp.ExitCode)" }
          Stop-Process -Id $hp.Id -Force -ErrorAction SilentlyContinue
          Get-Process VexWindowsHost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $node = Resolve-Path .\dist\VexNodeAgent\VexNodeAgent.exe
          $np = Start-Process -FilePath $node -WorkingDirectory .\dist\VexNodeAgent -PassThru
          Start-Sleep -Seconds 4
          $np.Refresh()
          if ($np.HasExited) { throw "VexNodeAgent exited during startup with code $($np.ExitCode)" }
          Stop-Process -Id $np.Id -Force -ErrorAction SilentlyContinue
          Get-Process VexNodeAgent -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Stage package
        shell: pwsh
        run: |
          $pkg='Vex-v0.11.7.33-Unified-Windows-Host'
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Copy-Item dist\VexWindowsHost "$pkg\VexWindowsHost" -Recurse
          Copy-Item dist\VexNodeAgent "$pkg\VexNodeAgent" -Recurse
          Copy-Item Tools\README-VexNetwork-v11733.txt "$pkg\README.txt"
          Compress-Archive -Path "$pkg\*" -DestinationPath Vex-v0.11.7.33-Unified-Windows-Host.zip -Force
          Expand-Archive Vex-v0.11.7.33-Unified-Windows-Host.zip -DestinationPath verify -Force
          if (!(Test-Path verify\VexWindowsHost\VexWindowsHost.exe)) { throw 'packaged host exe missing' }
          if (!(Test-Path verify\VexNodeAgent\VexNodeAgent.exe)) { throw 'packaged node agent missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Vex-v0.11.7.33-Unified-Windows-Host
          path: Vex-v0.11.7.33-Unified-Windows-Host.zip
          retention-days: 14
