name: Package VexBridge Windows Agent

on:
  push:
    branches: [vexbridge-dc-replacement]
    paths:
      - "VexBridge/**"
      - ".github/workflows/vexbridge-package.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install -r VexBridge/requirements.txt
          python -m pip install pyinstaller typer
      - name: Build onedir agent
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noupx --name VexBridgeMCP --collect-all mcp --collect-all pydantic_settings --collect-all reportlab VexBridge/server.py
      - name: Smoke packaged agent
        shell: pwsh
        run: |
          $env:VEXBRIDGE_HOST = "127.0.0.1"
          $env:VEXBRIDGE_PORT = "8795"
          $p = Start-Process ".\dist\VexBridgeMCP\VexBridgeMCP.exe" -PassThru -WindowStyle Hidden
          $ready = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep -Milliseconds 500
            try {
              $c = [System.Net.Sockets.TcpClient]::new()
              $c.Connect("127.0.0.1",8795)
              $c.Close()
              $ready = $true
              break
            } catch {}
          }
          if (-not $ready) { throw "Packaged VexBridge did not listen" }
          python VexBridge/smoke_client.py
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: Add launcher
        shell: pwsh
        run: |
          '@echo off' | Set-Content dist\VexBridgeMCP\START-VEXBRIDGE.cmd -Encoding ASCII
          'set VEXBRIDGE_HOST=127.0.0.1' | Add-Content dist\VexBridgeMCP\START-VEXBRIDGE.cmd -Encoding ASCII
          'set VEXBRIDGE_PORT=8795' | Add-Content dist\VexBridgeMCP\START-VEXBRIDGE.cmd -Encoding ASCII
          'start "" /min "%~dp0VexBridgeMCP.exe"' | Add-Content dist\VexBridgeMCP\START-VEXBRIDGE.cmd -Encoding ASCII
      - name: Archive package
        shell: pwsh
        run: Compress-Archive -Path dist\VexBridgeMCP\* -DestinationPath VexBridgeMCP-Windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: VexBridgeMCP-Windows
          path: VexBridgeMCP-Windows.zip
          if-no-files-found: error
