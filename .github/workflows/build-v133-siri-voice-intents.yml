name: Build VexNative v0.13.3 Siri Voice Intents

on:
  push:
    branches: [ "build/v133-siri-voice-intents" ]
    paths:
      - "Tools/apply_v133_siri_voice_intents.py"
      - "Tools/build_v133_siri_voice_intents.py"
      - "Tools/VexVoiceIntents.swift"
      - ".github/workflows/build-v133-siri-voice-intents.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-siri-voice:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Assemble v0.13.3
        run: python3 Tools/build_v133_siri_voice_intents.py

      - name: Verify Siri/App Intents source
        run: |
          test -f VexNative/VexVoiceIntents.swift
          grep -q 'enum VexQuickAction: String, AppEnum' VexNative/VexVoiceIntents.swift
          grep -q 'struct VexQuickActionIntent: AppIntent' VexNative/VexVoiceIntents.swift
          grep -q 'struct VexVoiceCommandIntent: AppIntent' VexNative/VexVoiceIntents.swift
          grep -Fq '"Hey \(.applicationName) \(\.$action)"' VexNative/VexVoiceIntents.swift
          grep -Fq '"Ask \(.applicationName) to \(\.$action)"' VexNative/VexVoiceIntents.swift
          grep -Fq '"Ask \(.applicationName)"' VexNative/VexVoiceIntents.swift
          grep -q 'VexAppShortcuts.updateAppShortcutParameters()' VexNative/VexNativeApp.swift
          grep -q 'VexVoiceIntents.swift in Sources' VexNative.xcodeproj/project.pbxproj
          grep -q 'PhoneRemoteCommandRelay.shared.run(app: app)' VexNative/ContentView.swift
          grep -q 'challenge.protectionSpace.port == 8771' VexNative/VexNativeApp.swift

      - name: Resolve local Swift package
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VexDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=133 \
            MARKETING_VERSION=0.13.3 \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Add permissions and verify build identity
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string VexNative uses your local network to connect privately to paired Vex Bridge computers, memory, tools, runtime status, art, voice providers, and phone control." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string VexNative uses the camera only when you choose camera or flashlight features." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string VexNative uses the microphone while voice mode is enabled." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string VexNative uses speech recognition while voice mode is enabled so spoken words can become chat text." "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.13.3"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = "133"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")" = "Vex"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.13.3-siri-voice-intents.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/VexNative-v0.13.3-siri-voice-intents.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.3-Siri-Voice-Intents
          path: VexNative-v0.13.3-siri-voice-intents.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.3-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
