name: Build Vex Agent Runtime v0.11.7.49 Greenline

on:
  push:
    branches: [ "feat/vex-agent-runtime-windows-v1" ]
    paths:
      - "Tools/apply_v11749_agent_runtime_foundation.py"
      - "Tools/VexAgentRuntimeInstall.py"
      - ".github/workflows/build-v11749-agent-runtime-greenline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-agent-runtime-greenline:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Assemble proven cognition and Agent Runtime source
        shell: pwsh
        run: |
          python Tools/build_v11728_chain.py
          python Tools/apply_v11729_windows_defender_safe.py
          python Tools/apply_v11729_bridge_onedir_hotfix.py
          python Tools/apply_v11734_bridge_responsive_boot.py
          python Tools/apply_v11737_ollama_recovery.py
          python Tools/apply_v11738_cognition_capacity_hotfix.py
          python Tools/apply_v11739_cognition_helper_bundle.py
          python Tools/apply_v11749_agent_runtime_foundation.py
          python Tools/apply_v11736_host_clipboard.py
          python Tools/apply_v11740_host_phone_ping.py

      - name: Verify Agent Runtime source graph
        shell: pwsh
        run: |
          python -m py_compile `
            Bridge/vex_bridge.py `
            Tools/VexMemoryWorker.py `
            Tools/VexDoctor.py `
            Tools/VexToolbox.py `
            Tools/VexRemoteSupport.py `
            Tools/VexWindowsHost-v11740.py `
            Tools/VexNodeAgent.py `
            Tools/VexAgentRuntimeInstall.py
          $bridge = Get-Content Bridge/vex_bridge.py -Raw
          foreach ($marker in @(
            '"version": "0.11.7.39"',
            '"agent_runtime_bundle": "0.11.7.49"',
            'MEMORY_WORKER_PORT = 8806',
            'parsed.path == "/memory/status"',
            'if parsed.path == "/adaptive/status"',
            'name="VexAdaptiveLearning"',
            'name="VexAutonomousImprovement"',
            'name="VexInitiativeScheduler"'
          )) {
            if (-not $bridge.Contains($marker)) { throw "Agent Runtime marker missing: $marker" }
          }
          $installer = Get-Content Tools/VexAgentRuntimeInstall.py -Raw
          foreach ($marker in @(
            'MEMORY_PORT = 8806',
            'wait_direct_memory()',
            'VexMemoryWorkerRuntime'
          )) {
            if (-not $installer.Contains($marker)) { throw "installer sidecar marker missing: $marker" }
          }

      - name: Build Agent Runtime components
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --contents-directory VexBridgeRuntime --noupx --windowed --name VexBridge --collect-all requests --collect-all bs4 --collect-all pypdf --collect-all cryptography Bridge/vex_bridge.py
          pyinstaller --noconfirm --clean --onedir --contents-directory VexMemoryRuntime --noupx --windowed --name VexMemoryWorker --hidden-import sqlite3 Tools/VexMemoryWorker.py
          pyinstaller --noconfirm --clean --onefile --noupx --console --name VexDoctor --collect-all requests --hidden-import sqlite3 Tools/VexDoctor.py
          pyinstaller --noconfirm --clean --onefile --noupx --windowed --name VexToolbox --hidden-import tkinter Tools/VexToolbox.py
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexRemoteSupport --collect-all requests Tools/VexRemoteSupport.py
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexWindowsHost --collect-all requests Tools/VexWindowsHost-v11740.py
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexNodeAgent Tools/VexNodeAgent.py
          pyinstaller --noconfirm --clean --onefile --noupx --windowed --name Install-Vex-Agent-Runtime-v0.11.7.49 Tools/VexAgentRuntimeInstall.py
          Copy-Item dist\VexMemoryWorker dist\VexBridge\VexMemoryWorkerRuntime -Recurse -Force
          foreach ($file in @(
            'dist\VexBridge\VexBridge.exe',
            'dist\VexBridge\VexMemoryWorkerRuntime\VexMemoryWorker.exe',
            'dist\VexDoctor.exe',
            'dist\VexToolbox.exe',
            'dist\VexRemoteSupport\VexRemoteSupport.exe',
            'dist\VexWindowsHost\VexWindowsHost.exe',
            'dist\VexNodeAgent\VexNodeAgent.exe',
            'dist\Install-Vex-Agent-Runtime-v0.11.7.49.exe'
          )) {
            if (!(Test-Path $file)) { throw "built component missing: $file" }
          }

      - name: Smoke test persistent memory worker
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'VexAgentMemorySmoke\Roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'VexAgentMemorySmoke\Local'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $worker = Resolve-Path .\dist\VexMemoryWorker\VexMemoryWorker.exe
          $p = Start-Process -FilePath $worker -WorkingDirectory .\dist\VexMemoryWorker -ArgumentList '--serve','--port','8806' -PassThru
          try {
            @'
          import json, time, urllib.request
          deadline=time.time()+25
          last=None
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8806/health',timeout=2) as r:
                      d=json.loads(r.read().decode())
                  assert d.get('ok') is True,d
                  print('memory worker health:',d)
                  break
              except Exception as exc:
                  last=exc; time.sleep(.5)
          else:
              raise SystemExit(f'memory worker never became healthy: {last}')
          '@ | python -
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process VexMemoryWorker -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test staged memory runtime
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'VexAgentMemoryStagedSmoke\Roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'VexAgentMemoryStagedSmoke\Local'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          Get-Process VexMemoryWorker -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $worker = Resolve-Path .\dist\VexBridge\VexMemoryWorkerRuntime\VexMemoryWorker.exe
          $p = Start-Process -FilePath $worker -WorkingDirectory .\dist\VexBridge\VexMemoryWorkerRuntime -ArgumentList '--serve','--port','8806' -PassThru
          try {
            @'
          import json, time, urllib.request
          deadline=time.time()+25
          last=None
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8806/health',timeout=2) as r:
                      d=json.loads(r.read().decode())
                  assert d.get('ok') is True,d
                  print('staged memory health:',d)
                  break
              except Exception as exc:
                  last=exc; time.sleep(.5)
          else:
              raise SystemExit(f'staged memory runtime never became healthy: {last}')
          '@ | python -
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process VexMemoryWorker -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test production-shaped memory Bridge and adaptive integration
        shell: pwsh
        run: |
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'VexAgentBridgeSmoke\Roaming'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'VexAgentBridgeSmoke\Local'
          New-Item -ItemType Directory -Force -Path $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          Get-Process VexBridge,VexMemoryWorker -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $worker = Resolve-Path .\dist\VexBridge\VexMemoryWorkerRuntime\VexMemoryWorker.exe
          $mp = Start-Process -FilePath $worker -WorkingDirectory .\dist\VexBridge\VexMemoryWorkerRuntime -ArgumentList '--serve','--port','8806' -PassThru
          try {
            @'
          import json,time,urllib.request
          deadline=time.time()+25
          last=None
          while time.time()<deadline:
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8806/health',timeout=2) as r:
                      d=json.loads(r.read().decode())
                  if d.get('ok'):
                      print('sidecar ready before Bridge:',d); break
              except Exception as exc:
                  last=exc
              time.sleep(.5)
          else:
              raise SystemExit(f'production sidecar did not become ready: {last}')
          '@ | python -

            $bridge = Resolve-Path .\dist\VexBridge\VexBridge.exe
            $bp = Start-Process -FilePath $bridge -WorkingDirectory .\dist\VexBridge -PassThru
            try {
              @'
          import json,os,time,urllib.error,urllib.parse,urllib.request
          from pathlib import Path
          config_path=Path(os.environ['APPDATA'])/'VexBridge'/'config.json'
          opener=urllib.request.build_opener(urllib.request.ProxyHandler({}))
          last='config not created'
          def req(path,timeout=5):
              cfg=json.loads(config_path.read_text('utf-8'))
              token=str(cfg.get('token') or '')
              port=int(cfg.get('local_control_port') or 0)
              if not token or not port: raise RuntimeError('local control identity not persisted yet')
              url=f'http://127.0.0.1:{port}{path}?'+urllib.parse.urlencode({'token':token})
              try:
                  with opener.open(url,timeout=timeout) as r: return json.loads(r.read().decode())
              except urllib.error.HTTPError as exc:
                  try: body=json.loads(exc.read().decode())
                  except Exception: body={'ok':False,'error':f'HTTP {exc.code}'}
                  if isinstance(body,dict): body['http_status']=exc.code
                  return body
          deadline=time.time()+80
          while time.time()<deadline:
              try:
                  s=req('/status')
                  if s.get('version')=='0.11.7.39' and s.get('local_control_protocol')=='vex-local-v1':
                      print('Bridge status:',s); break
                  last=s
              except Exception as exc: last=exc
              time.sleep(.5)
          else: raise SystemExit(f'Bridge never became ready: {last}')
          deadline=time.time()+20
          while time.time()<deadline:
              m=req('/memory/status')
              if m.get('ok'):
                  print('Bridge memory status:',m); break
              last=m; time.sleep(.5)
          else: raise SystemExit(f'Bridge could not see running memory sidecar: {last}')
          deadline=time.time()+45
          while time.time()<deadline:
              a=req('/adaptive/status')
              if a.get('ok') and a.get('worker_started'):
                  print('Adaptive status:',a); break
              last=a; time.sleep(.5)
          else: raise SystemExit(f'Adaptive worker liveness failed: {last}')
          '@ | python -
            } finally {
              Stop-Process -Id $bp.Id -Force -ErrorAction SilentlyContinue
              Get-Process VexBridge -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            }
          } finally {
            Stop-Process -Id $mp.Id -Force -ErrorAction SilentlyContinue
            Get-Process VexMemoryWorker -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test user-facing Windows processes
        shell: pwsh
        run: |
          $remote = Resolve-Path .\dist\VexRemoteSupport\VexRemoteSupport.exe
          $rp = Start-Process -FilePath $remote -WorkingDirectory .\dist\VexRemoteSupport -PassThru
          Start-Sleep -Seconds 7
          $rp.Refresh()
          if ($rp.HasExited) { throw "Remote Support exited during startup with $($rp.ExitCode)" }
          Stop-Process -Id $rp.Id -Force -ErrorAction SilentlyContinue
          Get-Process VexRemoteSupport -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $host = Resolve-Path .\dist\VexWindowsHost\VexWindowsHost.exe
          $hp = Start-Process -FilePath $host -WorkingDirectory .\dist\VexWindowsHost -PassThru
          Start-Sleep -Seconds 6
          $hp.Refresh()
          if ($hp.HasExited) { throw "Windows Host exited during startup with $($hp.ExitCode)" }
          Stop-Process -Id $hp.Id -Force -ErrorAction SilentlyContinue
          Get-Process VexWindowsHost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Stage Agent Runtime installer package
        shell: pwsh
        run: |
          $pkg='Vex-Agent-Runtime-v0.11.7.49-Greenline'
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Copy-Item dist\VexBridge\VexBridge.exe "$pkg\VexBridge.exe"
          Copy-Item dist\VexBridge\VexBridgeRuntime "$pkg\VexBridgeRuntime" -Recurse
          Copy-Item dist\VexMemoryWorker "$pkg\VexMemoryWorkerRuntime" -Recurse
          Copy-Item dist\VexDoctor.exe "$pkg\VexDoctor.exe"
          Copy-Item dist\VexToolbox.exe "$pkg\VexToolbox.exe"
          Copy-Item dist\VexRemoteSupport "$pkg\VexRemoteSupportRuntime" -Recurse
          Copy-Item dist\VexWindowsHost "$pkg\VexWindowsHost" -Recurse
          Copy-Item dist\VexNodeAgent "$pkg\VexNodeAgent" -Recurse
          Copy-Item dist\Install-Vex-Agent-Runtime-v0.11.7.49.exe "$pkg\Install-Vex-Agent-Runtime-v0.11.7.49.exe"
          @'
          Vex Agent Runtime v0.11.7.49 Greenline
          Production-shaped Agent Runtime build around the proven v0.11.7.39 PC cognition Bridge and working v0.11.7.48 iPhone pairing.
          Persistent memory runs as an independent local-only sidecar on 127.0.0.1:8806 and is started before Bridge by the installer.
          Includes persistent memory, adaptive learning, autonomous improvement, initiative scheduling, Remote Support, Windows Host, Node Agent and diagnostics.
          No paid API or cloud inference is introduced. Private pairing, profile and memory data remain local.
          Extract completely, then run Install-Vex-Agent-Runtime-v0.11.7.49.exe.
          '@ | Set-Content -Encoding UTF8 "$pkg\README.txt"
          Compress-Archive -Path "$pkg\*" -DestinationPath Vex-Agent-Runtime-v0.11.7.49-Greenline.zip -Force
          Expand-Archive Vex-Agent-Runtime-v0.11.7.49-Greenline.zip -DestinationPath verify-package -Force
          foreach ($file in @(
            'verify-package\VexBridge.exe',
            'verify-package\VexMemoryWorkerRuntime\VexMemoryWorker.exe',
            'verify-package\VexRemoteSupportRuntime\VexRemoteSupport.exe',
            'verify-package\VexWindowsHost\VexWindowsHost.exe',
            'verify-package\VexNodeAgent\VexNodeAgent.exe',
            'verify-package\Install-Vex-Agent-Runtime-v0.11.7.49.exe'
          )) {
            if (!(Test-Path $file)) { throw "verified ZIP missing: $file" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.49-Greenline
          path: Vex-Agent-Runtime-v0.11.7.49-Greenline.zip
          retention-days: 14
