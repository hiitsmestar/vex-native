name: Build Vex Dual-PC Coordination v0.11.7.65

on:
  push:
    branches: [ "build/v11765-dual-pc-coordination" ]
    paths:
      - "Tools/VexPeerCoordinator.py"
      - "Tools/Install-VexPeerCoordinator-v0.11.7.65.ps1"
      - ".github/workflows/build-v11765-dual-pc-coordination.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependency
        run: python -m pip install --upgrade pyinstaller
      - name: Verify source self-test
        run: python Tools/VexPeerCoordinator.py --self-test
      - name: Verify privacy and role invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          s = Path("Tools/VexPeerCoordinator.py").read_text(encoding="utf-8")
          assert 'VERSION = "0.11.7.65"' in s
          assert 'DEFAULT_PEER_NODE = "vex-8d8b20e0"' in s
          assert '"action": action' in s
          assert 'post_command(peer, "status")' in s
          assert 'secondary_ready' in s
          assert 'last_page + 1' in s
          assert 'chat' not in s.lower() or 'description' in s.lower()
          print("v0.11.7.65 source invariants verified")
          '@ | python -
      - name: Build coordinator executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --noupx `
            --name VexPeerCoordinator `
            --distpath dist/peer65 `
            --workpath build/peer65 `
            Tools/VexPeerCoordinator.py
          if (!(Test-Path dist/peer65/VexPeerCoordinator.exe)) { throw "VexPeerCoordinator.exe missing" }
      - name: Smoke test packaged self-test
        shell: pwsh
        run: |
          $p = Start-Process 'dist/peer65/VexPeerCoordinator.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged coordinator self-test failed with code $($p.ExitCode)" }
      - name: Package install-ready artifact
        shell: pwsh
        run: |
          $pkg='VexDualPC-v0.11.7.65-Coordination'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item dist/peer65/VexPeerCoordinator.exe "$pkg/VexPeerCoordinator.exe"
          Copy-Item Tools/Install-VexPeerCoordinator-v0.11.7.65.ps1 "$pkg/Install-VexPeerCoordinator-v0.11.7.65.ps1"
          @'
          VexNative Dual-PC Coordination v0.11.7.65
          =========================================

          Install this artifact on the UPSTAIRS primary PC only.

          It keeps the existing downstairs v0.11.7.64 Remote Support + Bridge stack intact
          and adds a lightweight upstairs coordinator. The coordinator sends only sanitized
          health/availability status commands through the existing issue #52 relay, waits
          for the exact downstairs result, records round-trip health locally, and marks the
          secondary ready only when its Bridge and cognition report healthy.

          No chat text, files, tokens, usernames, IPs, or personal paths are delegated.

          Install: right-click Install-VexPeerCoordinator-v0.11.7.65.ps1 and Run with PowerShell.
          '@ | Set-Content -Encoding UTF8 "$pkg/README.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: VexDualPC-v0.11.7.65-Coordination
          path: VexDualPC-v0.11.7.65-Coordination.zip
          if-no-files-found: error
          retention-days: 14
