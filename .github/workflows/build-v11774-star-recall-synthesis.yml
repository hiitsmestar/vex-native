name: Build Vex Agent Runtime v0.11.7.74 Star Recall Synthesis

on:
  push:
    branches: [ "fix/v11774-star-recall-synthesis" ]
    paths:
      - "Tools/apply_v11774_star_recall_synthesis.py"
      - "Tools/ci_v11774_star_recall_synthesis.py"
      - ".github/workflows/build-v11774-star-recall-synthesis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Build production Agent Runtime
        run: python Tools/ci_v11774_star_recall_synthesis.py
      - name: Verify v0.11.7.74 Star recall synthesis
        shell: python
        run: |
          from pathlib import Path
          b = Path("Bridge/vex_bridge.py").read_text(encoding="utf-8")
          i = Path("Tools/VexAgentRuntimeInstall.py").read_text(encoding="utf-8")
          assert '"agent_runtime_bundle": "0.11.7.74"' in b
          assert "def _v11774_star_score(" in b
          assert "def _v11774_is_internal_instruction_fact(" in b
          assert "def _v11774_render_star_recall(" in b
          assert "pc-memory-star-synthesis-v11774" in b
          assert 'BUNDLE_VERSION = "0.11.7.74"' in i
          assert "standalone_remote.exists()" in i
          compile(b, "Bridge/vex_bridge.py", "exec")
          print("v0.11.7.74 Star recall synthesis verified")
      - name: Upload v0.11.7.74 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.74-StarRecallSynthesis
          path: Vex-Agent-Runtime-v0.11.7.74-StarRecallSynthesis.zip
          if-no-files-found: error
          retention-days: 14
