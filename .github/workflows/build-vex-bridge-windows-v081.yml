name: Build Vex Bridge v0.8.1 Windows

on:
  workflow_dispatch:
  push:
    branches: [ "ci/v081-dual-pc-mesh" ]
  pull_request:
    branches: [ "ci/v080-hybrid-brain" ]

permissions:
  contents: read

jobs:
  build-windows-bridge:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bridge dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography
      - name: Apply secure pairing
        run: python Tools/apply_v074_bridge_pairing_patch.py
      - name: Apply search routing
        run: python Tools/apply_v075_search_routing_patch.py
      - name: Apply direct-answer prerequisites
        run: python Tools/apply_v076_direct_research_answers_patch.py
      - name: Apply grounded web research
        run: python Tools/apply_v077_grounded_research_patch.py
      - name: Apply photo prerequisites
        run: python Tools/apply_v078_photo_context_patch.py
      - name: Apply visual replies
        run: |
          python Tools/apply_v079_camera_visual_replies_patch.py
          python Tools/apply_v079_compile_hotfix.py
      - name: Apply visual routing and viewer prerequisites
        run: |
          python Tools/apply_v0710_visual_intent_fix.py
          python Tools/apply_v0711_zoomable_chat_images.py
      - name: Apply hybrid PC expansion brain
        run: |
          python -c "from pathlib import Path; p=Path('Tools/apply_v080_hybrid_brain_patch.py'); s=p.read_text(encoding='utf-8').replace('prefix(1500)', 'prefix(3400)'); p.write_text(s, encoding='utf-8')"
          python Tools/apply_v080_hybrid_brain_patch.py
      - name: Apply dual-PC mesh and music metadata
        run: |
          python Tools/apply_v081_dual_pc_mesh_patch.py
          Select-String -Path Bridge/vex_bridge.py -Pattern 'MUSIC_EXTENSIONS'
          Select-String -Path Bridge/vex_bridge.py -Pattern 'search_music'
          Select-String -Path Bridge/vex_bridge.py -Pattern 'node_name'
          Select-String -Path Bridge/vex_bridge_full.py -Pattern 'VERSION = "0.8.1"'
      - name: Syntax check bridge
        run: python -m py_compile Bridge/vex_bridge.py Bridge/vex_bridge_full.py
      - name: Build standalone VexBridge.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexBridge `
            --paths Bridge `
            --collect-all cryptography `
            --hidden-import tkinter `
            --hidden-import vex_bridge `
            Bridge/vex_bridge_full.py
          if (!(Test-Path dist/VexBridge.exe)) { throw "VexBridge.exe was not created" }
      - name: Create quick-start text
        shell: pwsh
        run: |
          @"
          Vex Bridge v0.8.1 dual-PC mesh quick start
          =========================================

          Install and run the SAME VexBridge.exe on both Windows PCs.
          Each PC keeps its own private pairing token and certificate pin.

          Primary/upstairs PC:
          - keep its full endpoint in Vex Brain -> Vex Bridge / SearXNG endpoint

          Second/kitchen PC:
          - paste its full endpoint into Vex Brain -> Second / kitchen PC Bridge endpoint

          Vex mirrors trusted memory and recent conversation to both private SQLite brain vaults.
          Normal PC-file searches query both nodes. Saying kitchen/downstairs PC targets the second node; saying upstairs/primary PC targets the first.
          Each machine still indexes every readable fixed drive while skipping system/cache noise.
          Music and DAW/project file metadata (WAV/FLAC/MP3/MIDI/Ableton/FL Studio/Reaper/etc.) is indexed by filename/path for future music-assistant tools and current file finding.
          This version does not yet take control of a DAW; it creates the multi-PC brain/file foundation for that later tool layer.
          "@ | Set-Content -Encoding UTF8 dist/README-VexBridge.txt
      - name: Package bridge zip
        shell: pwsh
        run: Compress-Archive -Path dist/VexBridge.exe,dist/README-VexBridge.txt -DestinationPath VexBridge-v0.8.1-Windows.zip -Force
      - name: Upload Windows bridge
        uses: actions/upload-artifact@v4
        with:
          name: VexBridge-v0.8.1-Windows
          path: VexBridge-v0.8.1-Windows.zip
          if-no-files-found: error
          retention-days: 7
