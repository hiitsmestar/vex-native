name: Build VexNative v0.13.5 Read-Only Bad Query Probe

on:
  push:
    branches: [ "build/v135-bad-query-probe" ]
    paths:
      - "Tools/VexBadQueryProbe.c"
      - "Tools/VexBadQueryDiagnostics.swift"
      - "Tools/apply_v135_bad_query_probe.py"
      - "Tools/build_v135_bad_query_probe.py"
      - ".github/workflows/build-v135-bad-query-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-bad-query-probe:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Assemble v0.13.5
        run: python3 Tools/build_v135_bad_query_probe.py

      - name: Verify read-only probe wiring
        run: |
          grep -q 'VexBadQueryProbe.c in Sources' VexNative.xcodeproj/project.pbxproj
          grep -q 'VexBadQueryDiagnostics.swift in Sources' VexNative.xcodeproj/project.pbxproj
          grep -q 'VexBadQueryProbeView()' VexNative/ContentView.swift
          grep -q 'v0.13.5-read-only-bad-query-probe-v1' VexNative/VexBadQueryDiagnostics.swift
          grep -q 'vex_bad_query_grant_read' VexNative/VexBadQueryProbe.c
          grep -q 'version.majorVersion == 26' VexNative/VexBadQueryDiagnostics.swift
          ! grep -q 'O_WRONLY' VexNative/VexBadQueryProbe.c
          ! grep -q 'O_RDWR' VexNative/VexBadQueryProbe.c
          ! grep -q 'unlink(' VexNative/VexBadQueryProbe.c
          ! grep -q 'rename(' VexNative/VexBadQueryProbe.c
          ! grep -q 'removeItem(' VexNative/VexBadQueryDiagnostics.swift
          ! grep -q 'createFile(' VexNative/VexBadQueryDiagnostics.swift
          ! grep -q 'replaceItem(' VexNative/VexBadQueryDiagnostics.swift
          grep -q 'V134_SIRI_HARDWARE_ROUTING' VexNative/VexVoiceIntents.swift
          grep -q 'PhoneRemoteCommandRelay.shared.run(app: app)' VexNative/ContentView.swift

      - name: Resolve local Swift package
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VexDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=135 \
            MARKETING_VERSION=0.13.5 \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Add permissions and verify build identity
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string VexNative uses your local network to connect privately to paired Vex Bridge computers, memory, tools, runtime status, art, voice providers, and phone control." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string VexNative uses the camera only when you choose camera features." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string VexNative uses the microphone while voice mode is enabled." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string VexNative uses speech recognition while voice mode is enabled so spoken words can become chat text." "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.13.5"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = "135"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")" = "Vex"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.13.5-read-only-bad-query-probe.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/VexNative-v0.13.5-read-only-bad-query-probe.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.5-Read-Only-Bad-Query-Probe
          path: VexNative-v0.13.5-read-only-bad-query-probe.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.5-build-log
          path: $RUNNER_TEMP/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
