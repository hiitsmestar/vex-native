name: Build Vex v0.11.7.35 PC Brain Windows Host

on:
  push:
    branches: [ "ci/v11731-windows-vex-host" ]
    paths:
      - "Tools/VexWindowsHost-v11735.py"
      - ".github/workflows/build-v11735-pc-brain-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pc-brain-host:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests
      - name: Verify source
        shell: pwsh
        run: |
          python -m py_compile Tools/VexWindowsHost-v11735.py
          $src = Get-Content Tools/VexWindowsHost-v11735.py -Raw
          if (-not $src.Contains('VERSION = "0.11.7.35"')) { throw 'version marker missing' }
          if (-not $src.Contains('bridge_post("/llm/chat"')) { throw 'PC Brain chat route missing' }
          if (-not $src.Contains('self.after(5000, self.poll_status)')) { throw 'automatic Bridge polling missing' }
          if (-not $src.Contains('"brain_mode": "PC Brain"')) { throw 'PC Brain mode marker missing' }
          if (-not $src.Contains('threading.Thread(target=route_chat')) { throw 'nonblocking chat worker missing' }
      - name: Build Windows Host
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexWindowsHost --collect-all requests Tools/VexWindowsHost-v11735.py
      - name: Smoke test packaged Host
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\VexWindowsHost\VexWindowsHost.exe
          $p = Start-Process -FilePath $exe -WorkingDirectory .\dist\VexWindowsHost -PassThru
          Start-Sleep -Seconds 7
          $p.Refresh()
          if ($p.HasExited) { throw "VexWindowsHost exited during startup with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-Process VexWindowsHost -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Stage package
        shell: pwsh
        run: |
          $pkg='Vex-v0.11.7.35-PC-Brain-Windows-Host'
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Copy-Item dist\VexWindowsHost "$pkg\VexWindowsHost" -Recurse
          @'
          Vex v0.11.7.35 PC Brain Windows Host
          =====================================
          Replaces only the Vex Windows Host layer. Keep the working v0.11.7.34 Bridge and existing Remote Support.

          Changes:
          - Windows Host Send now routes to Bridge /llm/chat and returns the real PC model response.
          - Incoming /message relay traffic is routed to the same PC Brain asynchronously.
          - Assistant replies are placed on the shared event stream for phone pickup.
          - Bridge status automatically refreshes every 5 seconds so the UI cannot remain stale after a Bridge restart.
          - Host /status exposes brain_mode = PC Brain when Bridge is healthy.

          Test order:
          1. Leave v0.11.7.34 Bridge running.
          2. Close the old v0.11.7.33 Windows Host only.
          3. Start VexWindowsHost\VexWindowsHost.exe from this package.
          4. Confirm the top-right status shows Bridge online / PC Brain / v0.11.7.34.
          5. Type a short message in the Host Send box and verify Vex replies from the PC model.
          '@ | Set-Content -Encoding UTF8 "$pkg\README.txt"
          Compress-Archive -Path "$pkg\*" -DestinationPath Vex-v0.11.7.35-PC-Brain-Windows-Host.zip -Force
          Expand-Archive Vex-v0.11.7.35-PC-Brain-Windows-Host.zip -DestinationPath verify -Force
          if (!(Test-Path verify\VexWindowsHost\VexWindowsHost.exe)) { throw 'packaged host exe missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: Vex-v0.11.7.35-PC-Brain-Windows-Host
          path: Vex-v0.11.7.35-PC-Brain-Windows-Host.zip
          retention-days: 14
