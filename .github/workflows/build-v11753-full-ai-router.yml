name: Build VexNative v0.11.7.53 Full AI Router

on:
  workflow_dispatch:
  push:
    branches:
      - build/v11753-full-ai-router
    paths:
      - 'VexNative/**'
      - 'Tools/apply_v11747_pc_cognition_diagnostics.py'
      - 'Tools/apply_v11748_pc_cognition_timeout_recovery.py'
      - 'Tools/apply_v11750_pc_cognition_owned_fallback.py'
      - 'Tools/apply_v11751_synchronous_profile_sync.py'
      - 'Tools/apply_v11752_primary_recall_owner.py'
      - 'Tools/apply_v11753_full_ai_router.py'
      - '.github/workflows/build-v11753-full-ai-router.yml'

permissions:
  contents: read

jobs:
  build-ios-pc-brain:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assemble proven iPhone Bridge and PC Brain chain
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/apply_v074_bridge_pairing_patch.py
          python3 Tools/apply_v075_search_routing_patch.py
          python3 Tools/apply_v076_direct_research_answers_patch.py
          python3 Tools/apply_v077_grounded_research_patch.py
          python3 Tools/apply_v078_photo_context_patch.py
          python3 Tools/apply_v079_camera_visual_replies_patch.py
          python3 Tools/apply_v079_compile_hotfix.py
          python3 Tools/apply_v0710_visual_intent_fix.py
          python3 Tools/apply_v0711_zoomable_chat_images.py
          python3 Tools/prepare_v082_build_chain.py
          python3 Tools/apply_v080_hybrid_brain_patch.py
          python3 Tools/apply_v081_dual_pc_mesh_patch.py
          python3 Tools/apply_v082_pc_tools_capability_patch.py
          python3 Tools/apply_v083_browser_url_tools_patch.py
          python3 Tools/apply_v084_self_learning_skills_patch.py
          python3 Tools/apply_v084_skill_resolution_order_hotfix.py
          python3 Tools/apply_v085_skill_compiler_patch.py
          python3 Tools/apply_v086_voice_ui_patch.py
          python3 Tools/apply_v087_voice_crash_hotfix.py
          python3 Tools/apply_v088_voice_transcript_patch.py
          python3 Tools/apply_v089_voice_conversation_patch.py
          python3 Tools/apply_v090_neural_voice_ios_patch.py
          python3 Tools/apply_v090_named_media_ios_patch.py
          python3 Tools/apply_v091_youtube_context_ios_patch.py
          python3 Tools/apply_v092_device_control_patch.py || true
          grep -q 'PhoneToolRouter' VexNative/ContentView.swift
          python3 Tools/apply_v093_cognition_ios_patch.py
          python3 Tools/apply_v094_art_ios_patch.py
          python3 Tools/apply_v0941_startup_safe_mode_patch.py
          python3 Tools/apply_v0942_send_reliability_patch.py
          python3 Tools/apply_v0943_dual_node_race_patch.py
          python3 Tools/apply_v0944_bridge_long_request_timeout_patch.py
          python3 Tools/apply_v095_resource_housekeeper_ios_patch.py
          python3 Tools/apply_v096_active_maintenance_ios_patch.py || true
          python3 Tools/apply_v098_ios_time_grounding_patch.py
          python3 Tools/apply_v107_art_ios_adapter_patch.py
          python3 Tools/apply_v108_ios_art_followup_grounding.py
          python3 Tools/apply_v110_ios_memory_sync.py
          python3 Tools/apply_v111_ios_memory_sync_hotfix.py

      - name: Apply PC cognition continuity and Full AI router
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/apply_v11743_roundtrip_continuity_compat.py
          python3 Tools/apply_v11747_pc_cognition_diagnostics.py
          python3 Tools/apply_v11748_pc_cognition_timeout_recovery.py
          python3 Tools/apply_v11750_pc_cognition_owned_fallback.py
          python3 Tools/apply_v11751_synchronous_profile_sync.py
          python3 Tools/apply_v11752_primary_recall_owner.py
          python3 Tools/apply_v11753_full_ai_router.py

      - name: Verify v0.11.7.53 Full AI routing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile Tools/apply_v11753_full_ai_router.py
          python3 - <<'PY'
          from pathlib import Path
          c = Path('VexNative/ContentView.swift').read_text(encoding='utf-8')
          required = [
              'private struct AgentReply: Decodable',
              'parts.path = "/agent/run"',
              'let agentWinner = await requestAgentReply(endpoint: primary, original: original)',
              'decoded.delegated?.lowercased() == "chat"',
              'await withTaskGroup(of: CognitionResult.self)',
              'let cognitionEndpoints = isVerifiedPersonalRecallTurn(original)',
              'await syncPersonalMetadata(endpoint: endpoint.value, app: app)',
          ]
          missing = [x for x in required if x not in c]
          if missing:
              raise SystemExit('Missing v0.11.7.53 markers: ' + ' | '.join(missing))
          agent_pos = c.index('let agentWinner = await requestAgentReply(endpoint: primary, original: original)')
          race_pos = c.index('await withTaskGroup(of: CognitionResult.self)', agent_pos)
          if agent_pos > race_pos:
              raise SystemExit('agent route does not precede cognition race')
          print('PASS v0.11.7.53 primary agent-first routing')
          PY

      - name: Resolve Swift package dependencies
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VexDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=11753 \
            MARKETING_VERSION=0.11.7.53 \
            build | tee "$RUNNER_TEMP/xcodebuild-v11753.log"

      - name: Preserve device permissions
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH" && test -d "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Vex uses your local network to connect privately to your paired Vex Bridge computer and PC Brain." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Vex uses the camera only when you choose camera or photo features." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Vex uses the microphone while voice mode is enabled." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string Vex uses speech recognition while voice mode is enabled." "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.11.7.53"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = "11753"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          rm -rf "$RUNNER_TEMP/ipa"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.11.7.53-FullAIRouter-unsigned.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/VexNative-v0.11.7.53-FullAIRouter-unsigned.ipa"

      - name: Upload v0.11.7.53 IPA
        uses: actions/upload-artifact@v4
        with:
          name: VexNative-v0.11.7.53-FullAIRouter
          path: VexNative-v0.11.7.53-FullAIRouter-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VexNative-v0.11.7.53-xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild-v11753.log
          if-no-files-found: ignore
          retention-days: 7
