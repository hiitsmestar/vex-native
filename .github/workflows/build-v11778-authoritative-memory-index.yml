name: Build Vex Agent Runtime v0.11.7.78 Authoritative Memory Index

on:
  push:
    branches: [ "fix/v11778-authoritative-memory-index" ]
    paths:
      - "Tools/apply_v11778_authoritative_memory_index.py"
      - "Tools/ci_v11778_authoritative_memory_index.py"
      - ".github/workflows/build-v11778-authoritative-memory-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Build production Agent Runtime
        run: python Tools/ci_v11778_authoritative_memory_index.py
      - name: Verify v0.11.7.78 authoritative memory extraction
        shell: python
        run: |
          from pathlib import Path
          import importlib.util
          import tempfile

          b = Path("Bridge/vex_bridge.py").read_text(encoding="utf-8")
          i = Path("Tools/VexAgentRuntimeInstall.py").read_text(encoding="utf-8")
          m = Path("Tools/VexMemoryWorker.py").read_text(encoding="utf-8")
          assert '"agent_runtime_bundle": "0.11.7.78"' in b
          assert 'BUNDLE_VERSION = "0.11.7.78"' in i
          assert 'VERSION = "0.11.2.1"' in m
          assert 'def _v11778_profile_chunks(' in m
          assert "canonical_key='core:star:profile'" in m
          assert '"extractor": "authoritative-profile-v11778"' in m
          assert 'memory_fts_rows != memory_rows' in m
          assert 'parsed.path == "/windows/window-action"' in b
          assert 'parsed.path == "/windows/apps"' in b
          assert 'pc-memory-star-query-v11775' in b
          assert "standalone_remote.exists()" in i
          compile(b, "Bridge/vex_bridge.py", "exec")
          compile(m, "Tools/VexMemoryWorker.py", "exec")

          spec = importlib.util.spec_from_file_location("vexmem_v11778", "Tools/VexMemoryWorker.py")
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          with tempfile.TemporaryDirectory() as td:
              db_path = Path(td) / "memory.sqlite3"
              db = mod.MemoryDB(db_path)
              profile = "Hair: neon glow yellow with a shaved nape\nFavorite quick food: Verde Mart\nHome: rural Kansas property\nPiercings: twenty-nine total"
              ok = db.upsert_memory({
                  "canonical_key": "core:star:profile",
                  "subject": "star",
                  "kind": "profile",
                  "text": profile,
                  "source_type": "synthetic-ci",
                  "authority": 100,
                  "confidence": 1.0,
                  "importance": 1.0,
              }, "synthetic-ci")
              assert ok
              facts = db.recall_facts("star", limit=16)
              texts = [x.get("text", "") for x in facts]
              assert "Hair: neon glow yellow with a shaved nape" in texts
              assert "Favorite quick food: Verde Mart" in texts
              assert "Home: rural Kansas property" in texts
              assert "Piercings: twenty-nine total" in texts
              if db.fts_available:
                  db.conn.execute("DELETE FROM memories_fts")
                  db.conn.commit()
                  db.conn.close()
                  db2 = mod.MemoryDB(db_path)
                  base_count = db2.conn.execute("SELECT COUNT(*) FROM memories WHERE active=1").fetchone()[0]
                  fts_count = db2.conn.execute("SELECT COUNT(*) FROM memories_fts").fetchone()[0]
                  assert base_count == fts_count == 1
                  db2.conn.close()
              else:
                  db.conn.close()
          print("v0.11.7.78 authoritative memory extraction + FTS repair verified")
      - name: Upload v0.11.7.78 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.78-AuthoritativeMemoryIndex
          path: Vex-Agent-Runtime-v0.11.7.78-AuthoritativeMemoryIndex.zip
          if-no-files-found: error
          retention-days: 14
