name: Build Vex Remote Support v0.11.7.68 Relay HTTP Poll Repair

on:
  push:
    branches: [ "fix/v11768-relay-http-poll" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Reassemble Remote Support source
        run: |
          python Tools/ci_v11757_autonomous_research_evidence_loop.py
          python Tools/apply_v11758_remote_relay_tail_pagination.py
          python Tools/apply_v11759_remote_command_ledger.py
          python Tools/apply_v11760_remote_startup_ondir.py
          python Tools/apply_v11761_remote_single_instance_definition.py
          python Tools/apply_v11762_remote_recent_command_poll.py
          python Tools/apply_v11767_persistent_remote_session.py
          python Tools/apply_v11768_relay_http_poll.py
      - name: Verify relay repair invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          s=Path('Tools/VexRemoteSupport.py').read_text(encoding='utf-8')
          assert 'VERSION = "0.11.7.68"' in s
          assert 'def relay_http(' in s
          assert 'Authorization": f"Bearer {token}"' in s
          assert 'Relay poll retrying:' in s
          assert 'last_page + 1' in s
          assert 'SESSION_SECONDS = None' in s
          assert 'Start Persistent Session' in s
          assert 'Support session ended after 2 hours' not in s
          print('v0.11.7.68 relay repair invariants verified')
          '@ | python -
      - name: Build relay
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexRemoteSupport --distpath dist/relay68 --workpath build/relay68 --collect-all requests Tools/VexRemoteSupport.py
          if (!(Test-Path dist/relay68/VexRemoteSupport/VexRemoteSupport.exe)) { throw 'missing relay exe' }
      - name: Smoke test relay startup
        shell: pwsh
        run: |
          $exe=Resolve-Path 'dist/relay68/VexRemoteSupport/VexRemoteSupport.exe'
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "relay exited: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Verify installer syntax
        shell: pwsh
        run: |
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Tools/Install-VexRemoteSupport-v0.11.7.68.ps1'),[ref]$null,[ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Package artifact
        shell: pwsh
        run: |
          $pkg='VexRemoteSupport-v0.11.7.68-RelayRepair'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Recurse dist/relay68/VexRemoteSupport "$pkg/VexRemoteSupport"
          Copy-Item Tools/Install-VexRemoteSupport-v0.11.7.68.ps1 "$pkg/Install-VexRemoteSupport-v0.11.7.68.ps1"
          @'
          Vex Remote Support v0.11.7.68 Relay Repair
          =============================================
          Install on both PCs using Install-VexRemoteSupport-v0.11.7.68.ps1.
          Existing node identity and persistent-session preference are preserved.
          This build replaces fragile long-lived gh-api polling with bounded direct
          GitHub HTTPS polling using the already-authorized local GitHub CLI token,
          with gh-api fallback and retry-on-transient-poll-failure behavior.
          '@ | Set-Content -Encoding UTF8 "$pkg/README.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: VexRemoteSupport-v0.11.7.68-RelayRepair
          path: VexRemoteSupport-v0.11.7.68-RelayRepair.zip
          if-no-files-found: error
          retention-days: 14
