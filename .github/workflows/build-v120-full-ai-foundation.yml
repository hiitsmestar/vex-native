name: Build Vex Agent Runtime v0.12.0 Full AI Foundation

on:
  push:
    branches: [ "build/v120-full-ai-foundation" ]
    paths:
      - "Tools/**"
      - "Bridge/**"
      - ".github/workflows/build-v120-full-ai-foundation.yml"
      - "VEXNATIVE_FULL_AI_RUNTIME.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Build cumulative Full AI Runtime
        run: python Tools/ci_v120_full_ai_foundation.py

      - name: Re-freeze and prove final Vex wants artifact
        run: python Tools/ci_v120_postbuild_wants_proof.py

      - name: Apply learning lifecycle and PC health autonomy then re-freeze final artifact
        run: |
          python Tools/apply_v120_learning_lifecycle.py
          python Tools/apply_v120_pc_health_autonomy.py
          python Tools/ci_v120_postbuild_wants_proof.py

      - name: Verify v0.12 core and field contract
        shell: python
        run: |
          from pathlib import Path

          bridge = Path("Bridge/vex_bridge.py").read_text(encoding="utf-8")
          host = Path("Tools/VexWindowsHost-v11740.py").read_text(encoding="utf-8")
          installer = Path("Tools/VexAgentRuntimeInstall.py").read_text(encoding="utf-8")
          worker = Path("Tools/VexMemoryWorker.py").read_text(encoding="utf-8")
          remote = Path("Tools/VexRemoteSupport.py").read_text(encoding="utf-8")

          for marker in [
              '"agent_runtime_bundle": "0.12.0"',
              'def _v120_capability_registry(',
              'def _v120_plan(',
              'def _v120_execute_tool(',
              'def _v120_agent_chat(',
              'def _v120_agent_owns_turn(message: str) -> bool:',
              'V120_LOOPBACK_CHAT_PROXY_BYPASS',
              'session.trust_env = False',
              '"vex-agent-recent-turn"',
              'def _v120_local_upgrade_requests() -> dict:',
              'parsed.path == "/autonomy/requests"',
              '"vex_wants_field_build": "74"',
              'V120_LEARNING_LIFECYCLE = "v0.12-active-state-learning-v1"',
              'def _v120_record_resolution_lesson(',
              'def _v120_retire_orphaned_adaptive_upgrades(',
              'V120_PC_HEALTH_AUTONOMY = "v0.12-pc-health-autonomy-v1"',
              'V120_IDLE_ROTATION = "v0.12-idle-productive-rotation-v1"',
              'def _v120_health_housekeeping_audit() -> dict:',
              'parsed.path == "/hardware/status"',
              'parsed.path == "/maintenance/status"',
              'parsed.path == "/maintenance/run"',
              'close requires explicit confirmation',
              'Never claim a tool action happened unless a confirmed tool result says it did',
              'Do not invent memories, sources, files, device state, or completed actions',
          ]:
              assert marker in bridge, marker

          for marker in [
              'wants74',
              'text="Vex wants / upgrade requests"',
              'def show_vex_wants(self):',
              'bridge_get("/autonomy/requests", timeout=8)',
              'CHAT_HISTORY: list[dict] = []',
              '"history": history',
          ]:
              assert marker in host, marker

          for marker in [
              'VERSION = "0.11.7.70"',
              'def hardware_public(',
              'action == "hardware_status"',
          ]:
              assert marker in remote, marker

          assert 'BUNDLE_VERSION = "0.12.0"' in installer
          assert 'REMOTE_VERSION = "0.11.7.70"' in installer
          assert 'VERSION = "0.11.4"' in worker
          assert Path("Vex-Agent-Runtime-v0.12.0-FullAIFoundation.zip").stat().st_size > 100_000
          print("PASS v0.12 core + lifecycle + PC health autonomy final-artifact contract")

      - name: Upload v0.12.0 Full AI Runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.12.0-FullAIFoundation
          path: Vex-Agent-Runtime-v0.12.0-FullAIFoundation.zip
          if-no-files-found: error
          retention-days: 14
