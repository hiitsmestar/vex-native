name: Build Vex Agent Runtime v0.11.7.50 Field Hotfix

on:
  push:
    branches: [ "feat/vex-agent-runtime-windows-v1" ]
    paths:
      - "Tools/apply_v11750_windows_locale_hotfix.py"
      - "Tools/ci_v11750_field_hotfix.py"
      - ".github/workflows/build-v11750-field-hotfix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v11750-field-hotfix:
    runs-on: windows-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Build and prove locale-safe Agent Runtime
        run: python Tools/ci_v11750_field_hotfix.py

      - name: Upload proven v0.11.7.50 field hotfix
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.50-FieldHotfix
          path: Vex-Agent-Runtime-v0.11.7.50-FieldHotfix.zip
          if-no-files-found: error
          retention-days: 14
