name: Build VexControl iOS
on:
  workflow_dispatch:
  push:
    branches: [build/vexcontrol-standalone]
    paths:
      - 'VexControl/**'
      - '.github/workflows/vexcontrol-ios.yml'
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec VexControl/project.yml
      - name: Build unsigned app
        run: xcodebuild -project VexControl/VexControl.xcodeproj -scheme VexControl -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VexControl.app Payload/
          zip -qry VexControl-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VexControl-iOS
          path: VexControl-unsigned.ipa
