name: PR Build Vex Art Safe Low-Memory v0.10.2

on:
  pull_request:
    branches: [ "ci/v100-vex-art-worker" ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests pillow beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp
      - name: Build v0.10.2 package
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File Tools/run_v102_build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Vex-Art-Safe-v0.10.2
          path: Vex-Art-Safe-v0.10.2.zip
          retention-days: 7
