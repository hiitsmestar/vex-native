name: Build VexBridge v0.9.8 Modular Toolbox

on:
  push:
    branches: [ "ci/v098-modular-toolbox" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp

      - name: Apply Bridge patch chain
        shell: pwsh
        run: |
          python Tools/apply_v074_bridge_pairing_patch.py
          python Tools/apply_v075_search_routing_patch.py
          python Tools/apply_v076_direct_research_answers_patch.py
          python Tools/apply_v077_grounded_research_patch.py
          python Tools/apply_v078_photo_context_patch.py
          python Tools/apply_v079_camera_visual_replies_patch.py
          python Tools/apply_v079_compile_hotfix.py
          python Tools/apply_v0710_visual_intent_fix.py
          python Tools/apply_v0711_zoomable_chat_images.py
          python Tools/prepare_v082_build_chain.py
          python Tools/apply_v080_hybrid_brain_patch.py
          python Tools/apply_v081_dual_pc_mesh_patch.py
          python Tools/apply_v082_pc_tools_capability_patch.py
          python Tools/apply_v083_browser_url_tools_patch.py
          python Tools/apply_v084_self_learning_skills_patch.py
          python Tools/apply_v084_skill_resolution_order_hotfix.py
          python Tools/apply_v085_skill_compiler_patch.py
          python Tools/apply_v086_bridge_media_patch.py
          python Tools/apply_v090_bridge_neural_media_patch.py
          python Tools/apply_v091_youtube_context_bridge_patch.py
          python Tools/apply_v092_bridge_control_patch.py
          python Tools/apply_v093_cognition_bridge_patch.py
          python Tools/apply_v094_art_bridge_patch.py
          python Tools/apply_v095_resource_housekeeper_art_patch.py
          python Tools/apply_v096_active_maintenance_bridge_patch.py
          python Tools/apply_v0961_bridge_stability_patch.py
          python Tools/apply_v0962_self_healing_patch.py
          python Tools/apply_v097_learning_engine_art_repair_patch.py
          python Tools/apply_v0971_art_dll_hotfix.py
          python Tools/apply_v0972_slow_cpu_coordination_hotfix.py
          python Tools/apply_v0973_render_grounding_learning_hotfix.py
          python Tools/apply_v098_modular_toolbox_time_patch.py
          python -m py_compile Bridge/vex_bridge.py Bridge/vex_bridge_full.py Tools/VexDoctor.py Tools/VexToolbox.py Tools/apply_v098_modular_toolbox_time_patch.py
          python -c "import sys; sys.path.insert(0,'Bridge'); import vex_bridge as v; assert hasattr(v,'_system_time_snapshot'); assert hasattr(v,'_system_time_prompt'); assert hasattr(v,'_tool_status'); assert hasattr(v,'_run_vex_doctor'); assert v._system_time_snapshot(False).get('source') == 'host operating-system clock'; assert hasattr(v,'_learning_worker_loop'); assert hasattr(v,'_art_execution_error_detail'); assert hasattr(v,'_cognition_rewarm_async'); print('Bridge v0.9.8 checks OK')"

      - name: Build VexBridge
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexBridge `
            --paths Bridge `
            --collect-all cryptography `
            --collect-all edge_tts `
            --collect-all yt_dlp `
            --hidden-import tkinter `
            --hidden-import sqlite3 `
            --hidden-import vex_bridge `
            --hidden-import winrt.windows.media.control `
            Bridge/vex_bridge_full.py
          if (!(Test-Path dist/VexBridge.exe)) { throw "VexBridge.exe missing" }

      - name: Build Vex Doctor
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console `
            --name VexDoctor `
            --hidden-import tkinter `
            --hidden-import sqlite3 `
            Tools/VexDoctor.py
          if (!(Test-Path dist/VexDoctor.exe)) { throw "VexDoctor.exe missing" }

      - name: Build Vex Toolbox
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name VexToolbox `
            --hidden-import tkinter `
            Tools/VexToolbox.py
          if (!(Test-Path dist/VexToolbox.exe)) { throw "VexToolbox.exe missing" }

      - name: Package v0.9.8
        shell: pwsh
        run: |
          Copy-Item Tools/VexBrainSetup.ps1 dist/VexBrainSetup.ps1
          Copy-Item Tools/VexArtSetup.ps1 dist/VexArtSetup.ps1
          Copy-Item Tools/VexBridgeWatchdog.ps1 dist/VexBridgeWatchdog.ps1
          Copy-Item Tools/START-VEX-SELF-HEAL.cmd dist/START-VEX-SELF-HEAL.cmd
          Copy-Item Tools/STOP-VEX-SELF-HEAL.cmd dist/STOP-VEX-SELF-HEAL.cmd
          Copy-Item Tools/VexToolManifest.json dist/VexToolManifest.json
          @'
          VexBridge v0.9.8 - Modular Toolbox + Doctor + Real Time
          ========================================================

          This is the first modular VexNative architecture build.

          CORE THAT STAYS AVAILABLE:
          - VexBridge authentication/routing and PC access
          - Ollama cognition routing
          - persistent knowledge/memory access
          - watchdog/self-heal
          - authoritative host-OS clock grounding

          SEPARATE ON-DEMAND TOOLS:
          - VexDoctor.exe: deterministic machine diagnostics independent of the LLM
          - VexToolbox.exe: clickable app drawer/workspace for Vex tools
          - ComfyUI remains an external local renderer that Bridge starts only when needed

          VEX DOCTOR CHECKS REAL MACHINE STATE:
          - authenticated Bridge status
          - Ollama availability + installed models
          - Vex Art/ComfyUI installation and health
          - optional 420-second deep PyTorch smoke test
          - learning SQLite integrity + counts
          - storage/free-space snapshot
          - relevant repair/render log tails
          - JSON + text reports under %%APPDATA%%\VexBridge\diagnostics

          BRIDGE TOOL BROKER:
          - GET /system/time gives exact OS time/date/timezone/elapsed PC-turn timing
          - GET /tools/list reports known tool availability
          - GET /diagnostics/latest returns the most recent deterministic report
          - POST /diagnostics/run launches only the whitelisted VexDoctor tool
          - arbitrary executable names from model/user text are never shell-executed

          TIME GROUNDING:
          Every PC cognition turn receives the real host OS date/time, weekday,
          timezone/UTC offset, Unix timestamp, and measured time since the previous
          PC cognition turn. Vex is told to use timestamps instead of guessing how
          much time has passed.

          MIGRATION POLICY:
          v0.9.8 does NOT rip working art/research/maintenance code out all at once.
          Doctor + broker + clock establish the modular boundary first. Heavy systems
          can then move into independent workers one at a time with regression tests.

          NO PAID API. NO CLOUD RENDERING. NO REQUIRED SUBSCRIPTION.

          INSTALL AFTER CURRENT v0.9.7.3 FIELD TESTING:
          1. Double-click STOP-VEX-SELF-HEAL.cmd in the old folder.
          2. Extract this ZIP into a fresh folder.
          3. Double-click START-VEX-SELF-HEAL.cmd.
          4. VexDoctor.exe and VexToolbox.exe are standalone clickable tools.
          5. Do NOT rerun VexBrainSetup.ps1 or VexArtSetup.ps1 for this Bridge update.
          '@ | Set-Content -Encoding UTF8 dist/README-v0.9.8.txt

          Compress-Archive -Path `
            dist/VexBridge.exe,`
            dist/VexDoctor.exe,`
            dist/VexToolbox.exe,`
            dist/VexToolManifest.json,`
            dist/VexBrainSetup.ps1,`
            dist/VexArtSetup.ps1,`
            dist/VexBridgeWatchdog.ps1,`
            dist/START-VEX-SELF-HEAL.cmd,`
            dist/STOP-VEX-SELF-HEAL.cmd,`
            dist/README-v0.9.8.txt `
            -DestinationPath VexBridge-v0.9.8-Modular-Toolbox-Time.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: VexBridge-v0.9.8-Modular-Toolbox-Time
          path: VexBridge-v0.9.8-Modular-Toolbox-Time.zip
          retention-days: 7
