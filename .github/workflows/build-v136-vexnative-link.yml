name: Build VexNative v0.13.6.1 VexNative Link

on:
  push:
    branches: [ "build/v136-vexnative-link" ]
    paths:
      - "Tools/apply_v136_vexnative_link.py"
      - "Tools/build_v136_vexnative_link.py"
      - ".github/workflows/build-v136-vexnative-link.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-vexnative-link:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Assemble v0.13.6.1
        run: python3 Tools/build_v136_vexnative_link.py

      - name: Verify VexNative link wiring
        run: |
          grep -q 'V136_VEXNATIVE_LINK = "v0.13.6.1-vexnative-link-v1"' VexNative/ContentView.swift
          grep -q '/vexnative/status' VexNative/ContentView.swift
          grep -q '/vexnative/autonomy' VexNative/ContentView.swift
          grep -q 'Send goal to VexNative' VexNative/ContentView.swift
          grep -q 'V136_VEXNATIVE_PROXY = "v0.13.6.1-vexnative-proxy-v1"' Bridge/vex_bridge.py
          grep -q 'VEXNATIVE_LOCAL = "http://127.0.0.1:8796"' Bridge/vex_bridge.py
          grep -q 'V134_SIRI_HARDWARE_ROUTING' VexNative/VexVoiceIntents.swift
          grep -q 'PhoneRemoteCommandRelay.shared.run(app: app)' VexNative/ContentView.swift
          grep -q 'v0.13.5-read-only-bad-query-probe-v1' VexNative/VexBadQueryDiagnostics.swift

      - name: Resolve local Swift package
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies

      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VexDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=1361 \
            MARKETING_VERSION=0.13.6.1 \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Add permissions and verify build identity
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string VexNative uses your local network to connect privately to paired Vex Bridge computers and the VexNative runtime." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string VexNative uses the camera only when you choose camera features." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string VexNative uses the microphone while voice mode is enabled." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string VexNative uses speech recognition while voice mode is enabled so spoken words can become chat text." "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.13.6.1"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = "1361"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$INFO_PLIST")" = "Vex"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.13.6.1-vexnative-link.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/VexNative-v0.13.6.1-vexnative-link.ipa"

      - uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.6.1-VexNative-Link
          path: VexNative-v0.13.6.1-vexnative-link.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.6.1-build-log
          path: $RUNNER_TEMP/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
