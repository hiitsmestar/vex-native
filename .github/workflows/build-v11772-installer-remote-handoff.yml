name: Build Vex Agent Runtime v0.11.7.72 Installer Remote Handoff

on:
  push:
    branches: [ "fix/v11772-installer-remote-handoff" ]
    paths:
      - "Tools/apply_v11772_installer_remote_handoff.py"
      - "Tools/ci_v11772_installer_remote_handoff.py"
      - ".github/workflows/build-v11772-installer-remote-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow

      - name: Build production Agent Runtime
        run: python Tools/ci_v11772_installer_remote_handoff.py

      - name: Verify installer handoff markers
        shell: python
        run: |
          from pathlib import Path
          t = Path("Tools/VexAgentRuntimeInstall.py").read_text(encoding="utf-8")
          assert 'BUNDLE_VERSION = "0.11.7.72"' in t
          assert "standalone_remote" in t
          assert "VexRemoteSupportRuntime" in t
          assert "standalone_remote.exists()" in t
          print("installer handoff markers verified")

      - name: Upload v0.11.7.72 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.72-InstallerRemoteHandoff
          path: Vex-Agent-Runtime-v0.11.7.72-InstallerRemoteHandoff.zip
          if-no-files-found: error
          retention-days: 14
