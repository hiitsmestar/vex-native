name: Build Vex Remote Support v0.11.7.69 Self Improvement Inspection

on:
  push:
    branches: [ "build/v11769-self-improvement-inspection" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Reassemble Remote Support source
        run: |
          python Tools/ci_v11757_autonomous_research_evidence_loop.py
          python Tools/apply_v11758_remote_relay_tail_pagination.py
          python Tools/apply_v11759_remote_command_ledger.py
          python Tools/apply_v11760_remote_startup_ondir.py
          python Tools/apply_v11761_remote_single_instance_definition.py
          python Tools/apply_v11762_remote_recent_command_poll.py
          python Tools/apply_v11767_persistent_remote_session.py
          python Tools/apply_v11768_relay_http_poll.py
          python Tools/apply_v11769_self_improvement_inspection.py
      - name: Verify self-improvement inspection invariants
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          s=Path('Tools/VexRemoteSupport.py').read_text(encoding='utf-8')
          assert 'VERSION = "0.11.7.69"' in s
          assert 'def self_improvement_public(' in s
          assert 'action == "self_improvement_status"' in s
          assert 'bridge_get("/autonomy/status"' in s
          assert 'vex-adaptive.sqlite3' in s
          assert 'SESSION_SECONDS = None' in s
          assert 'def relay_http(' in s
          print('v0.11.7.69 self-improvement inspection invariants verified')
          '@ | python -
      - name: Build relay
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noupx --windowed --name VexRemoteSupport --distpath dist/relay69 --workpath build/relay69 --collect-all requests Tools/VexRemoteSupport.py
          if (!(Test-Path dist/relay69/VexRemoteSupport/VexRemoteSupport.exe)) { throw 'missing relay exe' }
      - name: Smoke test relay startup
        shell: pwsh
        run: |
          $exe=Resolve-Path 'dist/relay69/VexRemoteSupport/VexRemoteSupport.exe'
          $p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "relay exited: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
      - name: Verify installer syntax
        shell: pwsh
        run: |
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'Tools/Install-VexRemoteSupport-v0.11.7.69.ps1'),[ref]$null,[ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Package artifact
        shell: pwsh
        run: |
          $pkg='VexRemoteSupport-v0.11.7.69-SelfImprovementInspection'
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item -Recurse dist/relay69/VexRemoteSupport "$pkg/VexRemoteSupport"
          Copy-Item Tools/Install-VexRemoteSupport-v0.11.7.69.ps1 "$pkg/Install-VexRemoteSupport-v0.11.7.69.ps1"
          @'
          Vex Remote Support v0.11.7.69 Self Improvement Inspection
          ===========================================================
          Install on the upstairs PC only for this diagnostic pass.
          Existing node identity and persistent-session preference are preserved.
          Adds a read-only self_improvement_status command that returns sanitized
          technical open gaps and staged upgrade proposals. Personal/preference/
          conversation gaps are deliberately not copied into the public relay.
          '@ | Set-Content -Encoding UTF8 "$pkg/README.txt"
          Compress-Archive -Path "$pkg/*" -DestinationPath "$pkg.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: VexRemoteSupport-v0.11.7.69-SelfImprovementInspection
          path: VexRemoteSupport-v0.11.7.69-SelfImprovementInspection.zip
          if-no-files-found: error
          retention-days: 14
