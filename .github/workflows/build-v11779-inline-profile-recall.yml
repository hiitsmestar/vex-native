name: Build Vex Agent Runtime v0.11.7.79 Inline Profile Recall

on:
  push:
    branches: [ "fix/v11779-inline-profile-recall" ]
    paths:
      - "Tools/apply_v11779_inline_profile_recall.py"
      - "Tools/ci_v11779_inline_profile_recall.py"
      - ".github/workflows/build-v11779-inline-profile-recall.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4 pypdf cryptography edge-tts winrt-Windows.Media.Control yt-dlp pillow
      - name: Build production Agent Runtime
        run: python Tools/ci_v11779_inline_profile_recall.py
      - name: Verify v0.11.7.79 canonical Star direct recall
        shell: python
        run: |
          import importlib.util
          import os
          import tempfile
          from pathlib import Path

          b = Path("Bridge/vex_bridge.py").read_text(encoding="utf-8")
          i = Path("Tools/VexAgentRuntimeInstall.py").read_text(encoding="utf-8")
          w = Path("Tools/VexMemoryWorker.py").read_text(encoding="utf-8")
          assert '"agent_runtime_bundle": "0.11.7.79"' in b
          assert 'pc-memory-star-query-v11775' in b
          assert 'def _v11777_window_action(' in b
          assert 'BUNDLE_VERSION = "0.11.7.79"' in i
          assert 'VERSION = "0.11.4"' in w
          assert "subject='star' OR canonical_key='core:star:profile'" in w
          assert 'if path == "/facts":' in w
          compile(b, "Bridge/vex_bridge.py", "exec")
          compile(i, "Tools/VexAgentRuntimeInstall.py", "exec")
          compile(w, "Tools/VexMemoryWorker.py", "exec")

          with tempfile.TemporaryDirectory(ignore_cleanup_errors=True) as td:
              os.environ["LOCALAPPDATA"] = td
              spec = importlib.util.spec_from_file_location("vex_memory_v11779", "Tools/VexMemoryWorker.py")
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              db_path = Path(td) / "field.sqlite3"
              db = mod.MemoryDB(db_path)
              now = mod._now()
              text = "Star prefers direct natural replies and keeps a private personal profile."
              db.conn.execute(
                  "INSERT INTO memories(id,canonical_key,subject,kind,text,tags,source_type,source_ref,authority,confidence,importance,created_at,updated_at,active) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,1)",
                  ("canonical-star", "core:star:profile", "star", "profile", text, "", "test", "", 100, 1.0, 1.0, now, now),
              )
              # Deliberately omit the FTS shadow row. v0.11.7.79 must retrieve the
              # authoritative canonical profile directly by subject/canonical key.
              db.conn.execute("DELETE FROM memories_fts WHERE memory_id='canonical-star'")
              db.conn.commit()
              facts = db.facts("star", limit=8)
              assert facts, "canonical Star profile direct fallback returned no facts"
              assert facts[0]["id"] == "canonical-star"
              assert facts[0]["text"] == text
              assert facts[0]["authority"] == 100
              assert float(facts[0]["confidence"]) == 1.0
              db.conn.close()
              mod.DB.conn.close()
          print("v0.11.7.79 canonical Star direct recall verified")
      - name: Upload v0.11.7.79 runtime
        uses: actions/upload-artifact@v4
        with:
          name: Vex-Agent-Runtime-v0.11.7.79-InlineProfileRecall
          path: Vex-Agent-Runtime-v0.11.7.79-InlineProfileRecall.zip
          if-no-files-found: error
          retention-days: 14
