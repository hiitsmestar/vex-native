name: Build VexNative v0.13.7 VexNative Relay

on:
  push:
    branches: [ "build/v137-vexnative-relay" ]
    paths:
      - "Tools/apply_v137_vexnative_relay.py"
      - "Tools/build_v137_vexnative_relay.py"
      - ".github/workflows/build-v137-vexnative-relay.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-vexnative-relay:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Assemble v0.13.7
        run: python3 Tools/build_v137_vexnative_relay.py
      - name: Verify relay wiring
        run: |
          grep -q 'V137_VEXNATIVE_RELAY = "v0.13.7-vexnative-relay-v1"' VexNative/ContentView.swift
          grep -q 'parts.port = 8771' VexNative/ContentView.swift
          grep -q 'let a2a = native\["a2a"\]' VexNative/ContentView.swift
          grep -q '/vexnative/status' VexNative/ContentView.swift
          grep -q '/vexnative/autonomy' VexNative/ContentView.swift
      - name: Resolve local Swift package
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies
      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild -project VexNative.xcodeproj -scheme VexNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/VexDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" CURRENT_PROJECT_VERSION=137 MARKETING_VERSION=0.13.7 build | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Add permissions and verify build identity
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string VexNative uses your local network to connect privately to paired Vex services." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string VexNative uses the camera only when you choose camera features." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string VexNative uses the microphone while voice mode is enabled." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string VexNative uses speech recognition while voice mode is enabled so spoken words can become chat text." "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.13.7"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = "137"
      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.13.7-vexnative-relay.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.13.7-VexNative-Relay
          path: VexNative-v0.13.7-vexnative-relay.ipa
          if-no-files-found: error
          retention-days: 14
