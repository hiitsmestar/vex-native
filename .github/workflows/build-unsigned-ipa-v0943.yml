name: Build unsigned iPhone IPA v0.9.4.4

on:
  workflow_dispatch:
  push:
    branches: [ "ci/v0943-dual-node-race" ]
  pull_request:
    branches: [ "ci/v0942-send-reliability" ]

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Apply secure bridge pairing
        run: python3 Tools/apply_v074_bridge_pairing_patch.py
      - name: Apply intent routing
        run: python3 Tools/apply_v075_search_routing_patch.py
      - name: Apply direct researched answers
        run: python3 Tools/apply_v076_direct_research_answers_patch.py
      - name: Apply grounded research
        run: python3 Tools/apply_v077_grounded_research_patch.py
      - name: Apply photo context
        run: python3 Tools/apply_v078_photo_context_patch.py
      - name: Apply camera and visual replies
        run: |
          python3 Tools/apply_v079_camera_visual_replies_patch.py
          python3 Tools/apply_v079_compile_hotfix.py
      - name: Apply robust visual intent
        run: python3 Tools/apply_v0710_visual_intent_fix.py
      - name: Apply zoomable image viewer
        run: python3 Tools/apply_v0711_zoomable_chat_images.py
      - name: Prepare v0.8.2 patch chain
        run: python3 Tools/prepare_v082_build_chain.py
      - name: Apply hybrid PC expansion brain
        run: python3 Tools/apply_v080_hybrid_brain_patch.py
      - name: Apply dual-PC mesh
        run: python3 Tools/apply_v081_dual_pc_mesh_patch.py
      - name: Apply grounded PC tools
        run: python3 Tools/apply_v082_pc_tools_capability_patch.py
      - name: Apply browser and URL tools
        run: python3 Tools/apply_v083_browser_url_tools_patch.py
      - name: Apply self-learning safe skills
        run: |
          python3 Tools/apply_v084_self_learning_skills_patch.py
          python3 Tools/apply_v084_skill_resolution_order_hotfix.py
      - name: Apply safe workflow compiler
        run: python3 Tools/apply_v085_skill_compiler_patch.py
      - name: Apply hands-free voice and media routing
        run: python3 Tools/apply_v086_voice_ui_patch.py
      - name: Apply first-tap voice crash hotfix
        run: python3 Tools/apply_v087_voice_crash_hotfix.py
      - name: Apply voice transcript reliability
        run: python3 Tools/apply_v088_voice_transcript_patch.py
      - name: Apply conversational voice replies
        run: python3 Tools/apply_v089_voice_conversation_patch.py
      - name: Apply v0.9.0 neural voice and named media
        run: |
          python3 Tools/apply_v090_neural_voice_ios_patch.py
          python3 Tools/apply_v090_named_media_ios_patch.py
      - name: Apply v0.9.1 YouTube context routing
        run: python3 Tools/apply_v091_youtube_context_ios_patch.py
      - name: Apply v0.9.2 device controls
        run: |
          python3 Tools/apply_v092_device_control_patch.py || true
          grep -q 'PhoneToolRouter' VexNative/ContentView.swift
      - name: Apply v0.9.3 cognition overlay
        run: python3 Tools/apply_v093_cognition_ios_patch.py
      - name: Apply v0.9.4 local art routing
        run: python3 Tools/apply_v094_art_ios_patch.py
      - name: Apply v0.9.4.1 startup-safe hotfix
        run: python3 Tools/apply_v0941_startup_safe_mode_patch.py
      - name: Apply v0.9.4.2 send reliability hotfix
        run: python3 Tools/apply_v0942_send_reliability_patch.py
      - name: Apply v0.9.4.3 dual-node cognition race
        run: python3 Tools/apply_v0943_dual_node_race_patch.py
      - name: Apply v0.9.4.4 Bridge long-request timeout fix
        run: |
          python3 Tools/apply_v0944_bridge_long_request_timeout_patch.py
          grep -n 'v0.9.4.4: cognition and local rendering' VexNative/VexNativeApp.swift
          grep -n 'timeoutIntervalForResource = 100' VexNative/VexNativeApp.swift
      - name: Resolve local Swift package
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies
      - name: Build unsigned device app
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild \
            -project VexNative.xcodeproj \
            -scheme VexNative \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/VexDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION=100 \
            MARKETING_VERSION=0.9.4.4 \
            build | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Add device permissions to built app
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          test -n "$APP_PATH"
          INFO_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSLocalNetworkUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string Vex uses your local network to connect privately to paired Vex Bridge computers, local cognition, and local image rendering." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Vex uses the camera only when you choose camera features or ask Vex to use the flashlight." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSMicrophoneUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Vex uses the microphone while voice mode is enabled so she can hear your commands and conversation." "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :NSSpeechRecognitionUsageDescription" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string Vex uses speech recognition while voice mode is enabled so spoken words can become private chat text." "$INFO_PLIST"
      - name: Verify built app metadata
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          INFO_PLIST="$APP_PATH/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.9.4.4"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")" = "100"
          file "$APP_PATH/VexNative" | tee "$RUNNER_TEMP/app-file.txt"
          grep -q "arm64" "$RUNNER_TEMP/app-file.txt"
      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.9.4.4-bridge-timeout.ipa" Payload
          /usr/bin/unzip -t "$GITHUB_WORKSPACE/VexNative-v0.9.4.4-bridge-timeout.ipa"
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VexNative-v0.9.4.4-Bridge-Timeout-Fix
          path: VexNative-v0.9.4.4-bridge-timeout.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VexNative-xcodebuild-log-v0.9.4.4
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
