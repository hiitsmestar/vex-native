name: Build VexNative v0.14.3 Roaming Relay Fallback
on:
  push:
    branches: [ "build/v143-roaming-relay-fallback" ]
    paths:
      - "Tools/apply_v143_roaming_relay_fallback.py"
      - "Tools/build_v143_roaming_relay_fallback.py"
      - ".github/workflows/build-v143-roaming-relay-fallback.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-roaming-fallback:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Assemble v0.14.3
        run: python3 Tools/build_v143_roaming_relay_fallback.py
      - name: Resolve packages
        run: xcodebuild -project VexNative.xcodeproj -scheme VexNative -resolvePackageDependencies
      - name: Build
        run: |
          set -o pipefail
          rm -rf "$RUNNER_TEMP/VexDerivedData"
          xcodebuild -project VexNative.xcodeproj -scheme VexNative -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/VexDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" CURRENT_PROJECT_VERSION=143 MARKETING_VERSION=0.14.3 build | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Add background permissions
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          INFO_PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:1 string fetch" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:2 string processing" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Delete :BGTaskSchedulerPermittedIdentifiers" "$INFO_PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers array" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers:0 string local.star.vexnative.background.refresh" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Add :BGTaskSchedulerPermittedIdentifiers:1 string local.star.vexnative.background.processing" "$INFO_PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")" = "0.14.3"
      - name: Package
        run: |
          APP_PATH="$(find "$RUNNER_TEMP/VexDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name 'VexNative.app' -print -quit)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/VexNative.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/VexNative-v0.14.3-roaming-relay-fallback.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.14.3-Roaming-Relay-Fallback
          path: VexNative-v0.14.3-roaming-relay-fallback.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: VexNative-v0.14.3-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
